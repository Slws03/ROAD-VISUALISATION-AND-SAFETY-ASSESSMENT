[project]
name = "irap-screening"
version = "0.1.0"
description = "Dashcam and IMU based screening pipeline for iRAP mid-block attribute coding"
requires-python = ">=3.11,<3.12"
dependencies = [
    "pydantic>=2.6",
    "pydantic-settings>=2.2",
    "pyyaml>=6.0",
    "numpy>=1.26,<2.0",
    "scipy>=1.12",
    "pandas>=2.2",
    "opencv-python>=4.9",
    "typer>=0.12",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff>=0.4"]

[project.scripts]
irap = "irap_screening.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/irap_screening"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
