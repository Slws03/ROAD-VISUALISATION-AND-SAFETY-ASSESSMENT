    + `<p class="calc">At ${Math.round(p.dist_m[i])} m (t = ${p.time_s[i].toFixed(1)} s): `
    + `grade = tan(pitch) × 100 = tan(${p.pitch_deg[i].toFixed(2)}°) × 100 = ${g.toFixed(2)}%.<br>`
    + (w.fallback
      ? `The segment's samples span less than ${minLength} m, so its single steepest sample is taken.<br>`
      : `From ${w.start_m} m to ${w.end_m} m (tinted) the grade stays at ${Math.abs(g).toFixed(2)}% or steeper: `
        + `the steepest gradient at least ${minLength} m long, as the iRAP Coding Manual records it, `
        + `so a shorter spike (a speed bump, a culvert) does not set the grade.<br>`)
    + `Pitch is the accelerometer's pitch averaged over the ${t.window_m} m of road centred here, `
    + `which averages out vibration; only windows lying wholly inside this segment count. `
    + `The accelerometer reads the vehicle's own `
    + `acceleration in the same channel as the slope, so it is removed first, taken from the change in `
    + `recorded speed: here ${p.long_accel_mps2[i].toFixed(2)} m/s², without which this sample's `
    + `accelerometer pitch would read ${p.pitch_accel_raw_deg[i].toFixed(2)}° instead of `
    + `${p.pitch_accel_deg[i].toFixed(2)}°.</p>`
    + crossCheckHtml(entry.gps_grade_pct == null ? null
      : `GPS altitude, through the same ${t.window_m} m windows, reads the steepest as `
        + `${entry.gps_grade_pct.toFixed(1)}%`, entry.needs_review);
}

function renderGradeDetails(segment, pick, dist) {
  const entry = segment.grade || {};
  const w = segment.grade_window;
  const p = data.profile;
  const t = data.config.grade;
  const assessed = entry.flag !== "not_assessed" && w;
  const gpsGrade = (p.gps_grade_pct ?? []).some((v) => v != null);
  document.getElementById("details-summary").innerHTML = gradeSummaryHtml(segment, entry);

  const deciding = assessed ? p.dist_m[w.index] : null;
  const band = assessed && !w.fallback ? [w.start_m, w.end_m] : null;
  const faint = cssVar("--border2"), muted = cssVar("--muted"), critical = cssVar("--critical"), text = cssVar("--text");
  const fmt = (unit, digits) => (u, v) => (v == null ? "-" : `${v.toFixed(digits)}${unit}`);
  detailCharts = [
    detailChart(document.getElementById("chart-a"), [
      { label: "Accelerometer pitch, uncorrected", stroke: faint, width: 1, value: fmt("°", 2) },
      { label: "Accelerometer pitch, acceleration removed", stroke: muted, width: 1, value: fmt("°", 2) },
      { label: `Pitch, averaged over ${t.window_m} m`, stroke: text, width: 1.5, value: fmt("°", 2) },
    ], { values: (u, ticks) => ticks.map((v) => `${v}°`) }, [{ value: 0, color: faint }], deciding,
    [dist, pick(p.pitch_accel_raw_deg), pick(p.pitch_accel_deg), pick(p.pitch_deg)]),

    detailChart(document.getElementById("chart-b"), [
      { label: "Longitudinal acceleration, from speed", stroke: text, width: 1.5, value: fmt(" m/s²", 2) },
    ], { values: (u, ticks) => ticks.map((v) => `${v} m/s²`) }, [{ value: 0, color: faint }], deciding,
    [dist, pick(p.long_accel_mps2)]),

    detailChart(document.getElementById("chart-c"), [
      { label: "Grade", stroke: text, width: 1.5, value: fmt("%", 2) },
      ...(gpsGrade ? [{ label: "GPS altitude", stroke: cssVar("--accent"), width: 1.25, dash: [5, 4],
        value: fmt("%", 2) }] : []),
    ], {
      // Labelled at the thresholds: uPlot's own ticks skip them on a short chart.
      splits: () => [-t.threshold_pct, 0, t.threshold_pct],
      values: (u, ticks) => ticks.map((v) => `${v}%`),
    }, [
      { value: t.threshold_pct, color: critical },
      { value: 0, color: faint },
      { value: -t.threshold_pct, color: critical },
    ], deciding,
    [dist, pick(p.grade_pct), ...(gpsGrade ? [pick(p.gps_grade_pct)] : [])],
    // Keep both thresholds in view, so a flat road reads as flat.
    (u, min, max) => [Math.min(min, -t.threshold_pct * 1.15), Math.max(max, t.threshold_pct * 1.15)],
    band),
  ];

  const rows = [];
  for (let k = 0; k < p.dist_m.length; k++) {
    if (p.dist_m[k] < segment.start_m || p.dist_m[k] >= segment.end_m) continue;
    const inWindow = band && p.dist_m[k] >= w.start_m && p.dist_m[k] <= w.end_m;
    rows.push(`<tr class="${assessed && k === w.index ? "deciding" : ""}${inWindow ? " window" : ""}">`
      + `<td>${p.dist_m[k].toFixed(1)}</td><td>${p.time_s[k].toFixed(2)}</td>`
      + `<td>${p.accel_x_mps2[k].toFixed(3)}</td><td>${p.long_accel_mps2[k].toFixed(3)}</td>`
      + `<td>${p.pitch_accel_raw_deg[k].toFixed(2)}</td><td>${p.pitch_accel_deg[k].toFixed(2)}</td>`
      + `<td>${p.pitch_deg[k].toFixed(2)}</td>`
      + `<td>${p.grade_pct[k].toFixed(2)}</td>`
      + (gpsGrade ? `<td>${p.gps_grade_pct[k] == null ? "-" : p.gps_grade_pct[k].toFixed(2)}</td>` : "")
      + `<td>${inWindow ? "yes" : ""}</td></tr>`);
  }
  document.getElementById("details-samples").innerHTML =
    `<summary>Samples in this segment (${rows.length})</summary>`
    + `<table><tr><th>Distance (m)</th><th>Time (s)</th><th>Accel x (m/s²)</th>`
    + `<th>Longitudinal accel (m/s²)</th><th>Accel pitch, uncorrected (°)</th>`
    + `<th>Accel pitch, corrected (°)</th><th>Averaged pitch (°)</th>`
    + `<th>Grade (%)</th>` + (gpsGrade ? `<th>GPS altitude grade (%)</th>` : "")
    + `<th>In ${data.config.segment.length_m / 10} m window</th></tr>`
    + rows.join("") + `</table>`;
}

function openDetails(module) {
  detailsModule = module;
  document.getElementById("details-overview-caption").textContent =
    `Whole route: ${module}. Top strip: each segment's ${module} flag (green normal, red critical, `
    + "grey not assessed). Shaded: this segment. Click to open another segment.";
  detailsDialog.showModal();
  if (typeof uPlot === "undefined") {
    // uPlot comes from a CDN, like Leaflet; offline, the summary still shows.
    document.getElementById("details-overview").textContent =
      "Charts unavailable: the chart library could not be loaded (offline?).";
    return;
  }
  renderOverview();
  renderDetails();
}

document.addEventListener("click", (event) => {
  const button = event.target.closest(".details-open");
  if (button) openDetails(button.dataset.module);
});
document.getElementById("details-close").addEventListener("click", () => detailsDialog.close());
document.getElementById("details-prev").addEventListener("click", () => select(selected - 1));
document.getElementById("details-next").addEventListener("click", () => select(selected + 1));
detailsDialog.addEventListener("close", () => {
  detailCharts.forEach((chart) => chart.destroy());
  detailCharts = [];
  overviewChart?.destroy();
  overviewChart = null;
});

// Left/right step frames, up/down step through the segments the filters show.
// Keys typed into a note, a select or the recommendation editor are left alone.
document.addEventListener("keydown", (event) => {
  if (selected === null || configDialog.open) return;
  if (event.target.closest("input, select, textarea")) return;
  if (event.key === "ArrowLeft") step(-1);
  if (event.key === "ArrowRight") step(1);
  if (event.key === "ArrowUp" || event.key === "ArrowDown") {
    const shown = data.segments.flatMap((segment, i) => (segmentMatchesFilters(segment) ? [i] : []));
    const at = shown.indexOf(selected);
    const next = event.key === "ArrowDown"
      ? shown.find((i) => i > selected) : shown.findLast((i) => i < selected);
    // At either end of the list, or nothing shown: stay put. A selection the
    // filters hide jumps to the first segment they do show.
    if (next === undefined && (at !== -1 || !shown.length)) return;
    event.preventDefault();
    select(next ?? shown[0]);
  }
});

function parseJsonl(text) {
  const map = new Map();
  for (const line of text.split("\n")) {
    const trimmed = line.trim();
    if (!trimmed) continue;
    const record = JSON.parse(trimmed);
    map.set(record.frame_id, record);
  }
  return map;
}

// A missing file (no sign detector run yet, say) is a valid state: it reads
// as an empty map, the same way load_detections() in Python treats a
// missing path as {} rather than an error.
function fetchJsonl(path) {
  return fetch(path)
    .then((response) => (response.ok ? response.text() : ""))
    .then(parseJsonl);
}

const ROUTE_KEY = "irap-view-route";

function renderRouteSwitcher() {
  const select = document.getElementById("route-select");
  // A single-route export never wrote routes.json, so there is nothing to
  // switch between; a scanned directory of exactly one route still could,
  // but showing a one-item switcher would just be noise.
  if (routeList.length < 2) {
    select.style.display = "none";
    return;
  }
  select.style.display = "block";
  select.innerHTML = routeList
    .map((route) => `<option value="${route.id}">${route.label}</option>`)
    .join("");
  select.value = currentRoute;
}

function loadRoute(routeId) {
  currentRoute = routeId;
  if (routeId) localStorage.setItem(ROUTE_KEY, routeId);
  renderRouteSwitcher();

  const prefix = routePrefix();
  return Promise.all([
    fetch(`${prefix}data.json`).then((response) => response.json()),
    fetchJsonl(`${prefix}detections/lane.jsonl`),
    fetchJsonl(`${prefix}detections/sign.jsonl`),
    // Saved since data.json was built. Only `irap view`'s server has it.
    fetch(`${prefix}review`).then((response) => (response.ok ? response.json() : null))
      .catch(() => null),
  ]).then(([payload, laneMap, signMap, reviews]) => {
    data = payload;
    if (reviews) {
      for (const segment of data.segments) segment.review = reviews[segment.segment_id] ?? {};
    }
    laneByFrame = laneMap;
    signByFrame = signMap;
    selected = null;
    frameIndex = 0;
    renderSidebar();
    renderMap();
    if (data.segments.length) {
      select(0);
    } else {
      parkMap();
      document.getElementById("detail").innerHTML =
        '<div class="empty" id="main-empty">Select a segment.</div>';
    }
  });
}

document.getElementById("route-select").addEventListener("change", (event) => {
  loadRoute(event.target.value);
});

// Upload exists only when the server can run the detectors; the server says
// so in /job. A server with no jobs at all answers /job with 404.
const uploadButton = document.getElementById("upload-button");
const uploadFile = document.getElementById("upload-file");
const uploadStatus = document.getElementById("job-status");
// Reload only for a job this page watched finish; otherwise a job that ended
// earlier would reload the page every time it opened.
let jobWatched = false;

function showJob(job) {
  document.getElementById("upload").hidden = !job.upload;
  const name = job.kind === "config" ? "Thresholds" : job.route_id;
  const running = job.state === "running";
  uploadButton.disabled = running;
  configApply.disabled = running;
  if (running) {
    jobWatched = true;
    const last = job.log.length ? ` - ${job.log[job.log.length - 1]}` : "";
    uploadStatus.textContent = `${name}: ${job.label} (${job.step}/${job.steps})${last}`;
    setTimeout(pollJob, 1000);
    return;
  }
  if (job.state === "failed") {
    uploadStatus.textContent = `${name}: ${job.label} failed - ${job.error}`;
  } else if (job.state === "done" && jobWatched) {
    jobWatched = false;
    if (job.kind === "config") {
      // Stay on the route and segment being looked at.
      uploadStatus.textContent = "Thresholds applied; every route's report re-ran.";
      const keep = selected;
      loadRoute(currentRoute).then(() => {
        if (keep !== null && keep < data.segments.length) select(keep);
      });
      return;
    }
    localStorage.setItem(ROUTE_KEY, job.route_id);
    location.reload();
  }
}

function pollJob() {
  fetch("job")
    .then((response) => (response.ok ? response.json() : null))
    .then((job) => { if (job) showJob(job); })
    .catch(() => setTimeout(pollJob, 1000));
}

uploadButton.addEventListener("click", () => uploadFile.click());
uploadFile.addEventListener("change", () => {
  const file = uploadFile.files[0];
  if (!file) return;
  uploadFile.value = "";
  uploadButton.disabled = true;
  uploadStatus.textContent = `Uploading ${file.name}...`;
  const name = file.name.replace(/\.zip$/i, "");
  fetch(`upload?name=${encodeURIComponent(name)}`, {
    method: "POST",
    headers: { "Content-Type": "application/zip" },
    body: file,
  })
    .then((response) => {
      if (!response.ok) throw new Error(response.statusText);
      return response.json();
    })
    .then(showJob)
    .catch((error) => {
      uploadButton.disabled = false;
      uploadStatus.textContent = `Upload refused: ${error.message}`;
    });
});

// Thresholds: what every flag on this page was decided with. Under `irap view`
// over a directory of routes the server lists them with their sources (GET
// /config) and can re-run the report under changed ones (POST /config); on any
// other server the table is read-only, from this route's data.json.
const configDialog = document.getElementById("config");
const configApply = document.getElementById("config-apply");
const configError = document.getElementById("config-error");
const CONFIG_NOTES = {
  "lane.clrernet_conf": "Lowering it below the floor of the cached lane dump has no effect.",
  "segment.length_m": "Also sets grade's sustained window, a tenth of this.",
  "curvature.window_m": "Radius is this much road over its heading change; a segment is "
    + "coded by the sharpest such window lying wholly inside it. Shorter catches short "
    + "curves but lets more gyro noise through.",
  "grade.gps_max_step_pct": "GPS-altitude cross-check only: a climb between consecutive "
    + "fixes steeper than this is treated as a receiver jump and dropped.",
  "grade.window_m": "Accelerometer pitch is averaged over this much road; only windows "
    + "lying wholly inside a segment code it. Shorter keeps short steep pitches but lets "
    + "more vibration through.",
};

function flattenConfig(tree, prefix = "") {
  return Object.entries(tree).reduce((flat, [key, value]) => (
    value && typeof value === "object" && !Array.isArray(value)
      ? { ...flat, ...flattenConfig(value, `${prefix}${key}.`) }
      : { ...flat, [`${prefix}${key}`]: value }
  ), {});
}

function configText(value) {
  return Array.isArray(value) ? JSON.stringify(value) : String(value);
}

function renderConfig(state) {
  const editable = state !== null;
  const values = editable ? state.values : flattenConfig(data.config);
  const detector = new Set(editable ? state.detector_keys : []);
  document.getElementById("config-note").textContent = editable
    ? "Changes apply to every route on this page and re-run the report from the cached "
      + "detections; the detectors themselves do not run again. They last until the server "
      + "stops: restarting irap view returns to the values it was started with. Source: "
      + "default (configs/default.yaml), profile (--config), cli (--set), viewer (changed here)."
    : "Read-only: the values this route's report was built with. Serve a directory of "
      + "routes with irap view to change them here.";
  configApply.hidden = !editable;
  configError.textContent = "";
  let section = null;
  const rows = [];
  for (const [key, value] of Object.entries(values)) {
    const [head, ...rest] = key.split(".");
    if (head !== section) {
      section = head;
      rows.push(`<tr><th class="section" colspan="4">${head}</th></tr>`);
    }
    const text = attrEscape(configText(value));
    const source = editable ? state.sources[key] : "";
    const cell = editable && !detector.has(key)
      ? `<input data-key="${key}" value="${text}">`
      : text;
    const note = detector.has(key)
      ? "Read by the detector: re-run it to change this."
      : (CONFIG_NOTES[key] ?? "");
    rows.push(`<tr><td>${rest.join(".")}</td><td>${cell}</td>`
      + `<td class="${source}">${source}</td><td class="metrics">${note}</td></tr>`);
  }
  document.getElementById("config-table").innerHTML = rows.join("");
}

document.getElementById("config-open").addEventListener("click", () => {
  fetch("config")
    .then((response) => (response.ok ? response.json() : null))
    .catch(() => null)
    .then((state) => {
      renderConfig(state);
      configDialog.showModal();
    });
});
document.getElementById("config-close").addEventListener("click", () => configDialog.close());
document.getElementById("config-table").addEventListener("input", (event) => {
  event.target.classList.toggle("changed", event.target.value !== event.target.defaultValue);
});
configApply.addEventListener("click", () => {
  const changes = {};
  for (const input of configDialog.querySelectorAll("input.changed")) {
    changes[input.dataset.key] = input.value.trim();
  }
  if (!Object.keys(changes).length) {
    configError.textContent = "Nothing changed.";
    return;
  }
  configApply.disabled = true;
  fetch("config", {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify(changes),
  })
    .then((response) => response.json().then((body) => ({ ok: response.ok, body })))
    .then(({ ok, body }) => {
      if (!ok) {
        configApply.disabled = false;
        configError.textContent = body.error;
        return;
      }
      configDialog.close();
      showJob(body);
    })
    .catch((error) => {
      configApply.disabled = false;
      configError.textContent = `Could not apply: ${error.message}`;
    });
});

pollJob();

// routes.json exists only for a scanned directory of routes; a single-route
// export has no such file, and 404/network failure both read the same way
// here -- fall back to loading the page's own data.json directly.
fetch("routes.json")
  .then((response) => (response.ok ? response.json() : null))
  .then((routes) => {
    routeList = Array.isArray(routes) && routes.length ? routes : [];
    const stored = localStorage.getItem(ROUTE_KEY);
    const initial = routeList.length
      ? (routeList.find((route) => route.id === stored) || routeList[0]).id
      : null;
    return loadRoute(initial);
  })
  .catch((error) => {
    document.getElementById("main-empty").textContent =
      "Could not load data.json - open this page through the local server "
      + "(irap view), not by double-clicking the file. " + error;
  });
</script>
</body>
</html>
