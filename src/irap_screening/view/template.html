<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>iRAP screening viewer</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<link rel="stylesheet" href="https://unpkg.com/uplot@1.6.31/dist/uPlot.min.css">
<style>
  :root {
    --bg: #14161a;
    --panel: #1c1f26;
    --line: #2c313b;
    --text: #e6e8ec;
    --muted: #949bab;
    --normal: #3fb950;
    --watch: #d29922;
    --critical: #f85149;
    --unassessed: #6e7681;
    --surface2: #262b35;
    --surface2-hover: #323847;
    --hover: #232730;
    --active-bg: #2b3040;
    --map-bg: #0f1114;
    --rec-bg: #21242c;
    --border2: #4b5468;
    --border2-hover: #6a7284;
    --gap: #a371f7;
  }
  :root[data-theme="light"] {
    --bg: #f4f5f7;
    --panel: #ffffff;
    --line: #e2e4ea;
    --text: #1b1e24;
    --muted: #6b7280;
    --normal: #1a7f37;
    --watch: #9a6700;
    --critical: #cf222e;
    --unassessed: #6e7681;
    --surface2: #eceef2;
    --surface2-hover: #dde1e8;
    --hover: #eef1f5;
    --active-bg: #dfe4ee;
    --map-bg: #e5e7eb;
    --rec-bg: #f6f7f9;
    --border2: #c7ccd6;
    --border2-hover: #98a0ae;
    --gap: #8250df;
  }
  * { box-sizing: border-box; }
  body {
    /* Without overflow:hidden the window scrolls instead of the panels, which
       breaks scroll preservation when stepping frames and drags the sidebar
       off-screen. */
    margin: 0; height: 100vh; overflow: hidden; display: flex; padding: 14px;
    background: var(--bg); color: var(--text);
    font: 14px/1.5 ui-sans-serif, system-ui, "Segoe UI", sans-serif;
  }
  #app {
    flex: 1; display: flex; min-width: 0; min-height: 0;
    border: 1px solid var(--line); border-radius: 10px; overflow: hidden;
  }
  aside {
    width: 340px; flex: none; display: flex; flex-direction: column;
    border-right: 1px solid var(--line); background: var(--panel); min-width: 0;
  }
  header {
    padding: 14px 16px; border-bottom: 1px solid var(--line);
    display: flex; align-items: flex-start; justify-content: space-between; gap: 8px;
  }
  #title-block { min-width: 0; flex: 1; }
  h1 { margin: 0 0 2px; font-size: 15px; }
  .sub { color: var(--muted); font-size: 12px; }
  #theme-toggle { flex: none; padding: 5px; display: flex; }
  #route-select {
    display: none; margin-top: 8px; width: 100%;
    background: var(--surface2); color: var(--text); border: 1px solid var(--line);
    border-radius: 4px; padding: 4px 8px; font: inherit;
  }
  #actions { margin-top: 8px; display: flex; gap: 6px; flex-wrap: wrap; }
  #job-status { margin-top: 4px; overflow-wrap: anywhere; }
  #coverage { padding: 10px 16px; border-bottom: 1px solid var(--line); font-size: 12px; }
  #coverage span { color: var(--muted); }
  #segment-filters {
    padding: 8px 16px; border-bottom: 1px solid var(--line);
    display: flex; align-items: center; gap: 6px; flex-wrap: wrap;
  }
  .chip {
    background: transparent; border: 1px solid var(--line); color: var(--muted);
    border-radius: 999px; padding: 2px 10px; font-size: 12px; cursor: pointer; font: inherit;
  }
  .chip.critical.active { background: var(--critical); border-color: var(--critical); color: #fff; }
  .chip.gap.active { background: var(--gap); border-color: var(--gap); color: #fff; }
  .chip.uncovered.active { background: var(--muted); border-color: var(--muted); color: #fff; }
  #filter-status { color: var(--muted); font-size: 12px; margin-left: auto; }
  #segments { flex: 1; overflow-y: auto; }
  .seg {
    padding: 9px 16px; border-bottom: 1px solid var(--line);
    border-left: 3px solid transparent;
    cursor: pointer; display: flex; align-items: center; gap: 9px;
  }
  .seg:hover { background: var(--hover); }
  .seg.active { background: var(--active-bg); }
  /* A gap-check recommendation is a missing mitigation, not an attribute
     severity -- a distinct accent color and a border (not a dot) keeps it
     from being read as another module flag. */
  .seg.has-gap { border-left-color: var(--gap); }
  .seg .id { font-variant-numeric: tabular-nums; }
  .seg .range { color: var(--muted); font-size: 12px; margin-left: auto; }
  .dot { width: 9px; height: 9px; border-radius: 50%; flex: none; }
  .dot.normal { background: var(--normal); }
  .dot.watch { background: var(--watch); }
  .dot.critical { background: var(--critical); }
  .dot.not_assessed { background: var(--unassessed); }
  #map {
    height: 220px; flex: none; border-top: 1px solid var(--line);
    background: var(--map-bg); position: relative;
  }
  #map-grip {
    position: absolute; top: 6px; right: 6px; width: 24px; height: 24px;
    z-index: 1000; cursor: nesw-resize; border-radius: 4px;
    background: var(--surface2); border: 1px solid var(--border2); color: var(--text);
    box-shadow: 0 1px 4px rgba(0, 0, 0, .5);
    display: flex; align-items: center; justify-content: center;
  }
  #map-grip:hover, #map-grip.active { background: var(--surface2-hover); border-color: var(--border2-hover); }
  main { flex: 1; overflow-y: auto; padding: 20px 24px; }
  .empty { color: var(--muted); margin-top: 40px; text-align: center; }
  figure { margin: 0 0 16px; }
  .frame-wrap {
    position: relative; max-width: 900px; overflow: hidden;
    border: 1px solid var(--line); border-radius: 4px; background: #000;
  }
  .frame-wrap img { width: 100%; display: block; }
  .frame-wrap .overlay {
    position: absolute; inset: 0; width: 100%; height: 100%;
    pointer-events: none;
  }
  .frame-wrap .overlay.hidden { display: none; }
  figcaption label { display: flex; align-items: center; gap: 4px; cursor: pointer; }
  figcaption {
    display: flex; align-items: center; gap: 12px;
    margin-top: 8px; color: var(--muted); font-size: 12px;
  }
  button {
    background: var(--surface2); color: var(--text); border: 1px solid var(--line);
    border-radius: 4px; padding: 4px 11px; cursor: pointer; font: inherit;
  }
  button:disabled { opacity: .4; cursor: default; }
  table { border-collapse: collapse; width: 100%; max-width: 900px; margin-bottom: 18px; }
  th, td { text-align: left; padding: 7px 10px; border-bottom: 1px solid var(--line); }
  th { color: var(--muted); font-weight: 500; font-size: 12px; }
  td.flag { font-weight: 600; }
  td.flag.normal { color: var(--normal); }
  td.flag.watch { color: var(--watch); }
  td.flag.critical { color: var(--critical); }
  td.flag.not_assessed { color: var(--unassessed); }
  .metrics { color: var(--muted); font-size: 12px; font-variant-numeric: tabular-nums; }
  .review-cell { min-width: 220px; }
  .review { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
  .review select, .review input[type="text"] {
    background: var(--surface2); color: var(--text); border: 1px solid var(--line);
    border-radius: 4px; padding: 3px 6px; font: inherit; font-size: 12px;
  }
  .review input[type="text"] { flex: 1; min-width: 90px; }
  .review-status { width: 100%; color: var(--muted); font-size: 11px; }
  .rec {
    border-left: 3px solid var(--critical); background: var(--rec-bg);
    padding: 10px 14px; margin-bottom: 10px; max-width: 900px; border-radius: 0 4px 4px 0;
  }
  .rec .rule { font-weight: 600; }
  .rec .text { margin-top: 4px; line-height: 1.5; }
  h2 { font-size: 13px; color: var(--muted); font-weight: 500;
       text-transform: uppercase; letter-spacing: .04em; margin: 22px 0 8px; }
  code { background: var(--surface2); padding: 1px 5px; border-radius: 3px; font-size: 12px; }
  .details-open { padding: 1px 8px; font-size: 12px; white-space: nowrap; }
  #details, #config {
    width: min(1200px, 94vw); max-height: 92vh; padding: 0;
    border: 1px solid var(--line); border-radius: 10px;
    background: var(--panel); color: var(--text);
  }
  #config { width: min(860px, 94vw); }
  #details::backdrop, #config::backdrop { background: rgb(0 0 0 / .55); }
  #details > header, #config > header {
    position: sticky; top: 0; z-index: 2; background: var(--panel);
    padding: 12px 16px; border-bottom: 1px solid var(--line); gap: 6px;
  }
  #details h3, #config h3 { margin: 0; font-size: 15px; margin-right: auto; }
  #details .body, #config .body { padding: 6px 16px 16px; }
  #config-note { max-width: 780px; }
  #config-error { color: var(--critical); white-space: pre-wrap; font-size: 12px; }
  #config-table { font-size: 12px; font-variant-numeric: tabular-nums; }
  #config-table td, #config-table th { padding: 4px 10px; }
  #config-table th.section { color: var(--text); font-size: 13px; padding-top: 14px; }
  #config-table input {
    width: 160px; background: var(--surface2); color: var(--text);
    border: 1px solid var(--line); border-radius: 4px; padding: 2px 6px; font: inherit;
  }
  #config-table input.changed { border-color: var(--watch); }
  #config-table .viewer { color: var(--watch); }
  #details .chart-title { color: var(--muted); font-size: 12px; margin: 14px 0 0; }
  #details-summary p { margin: 6px 0; max-width: 900px; }
  #details-summary .calc { color: var(--muted); font-size: 12px; font-variant-numeric: tabular-nums; }
  #details-summary .critical { color: var(--critical); }
  #details-summary .normal { color: var(--normal); }
  #details-samples { margin-top: 14px; }
  #details-samples summary { cursor: pointer; color: var(--muted); font-size: 12px; }
  #details-samples table { font-size: 12px; font-variant-numeric: tabular-nums; max-width: none; margin-top: 6px; }
  #details-samples td, #details-samples th { padding: 3px 10px; }
  #details-samples tr.gated td { color: var(--unassessed); }
  #details-samples tr.deciding td { color: var(--critical); font-weight: 600; }
  #details-samples tr.window td { background: var(--active-bg); }
</style>
</head>
<body>
<div id="app">
<aside>
  <header>
    <div id="title-block">
      <h1 id="route">Loading…</h1>
      <div class="sub" id="generated"></div>
      <select id="route-select" title="Switch route"></select>
      <div id="actions">
        <button id="config-open">Thresholds</button>
        <span id="upload" hidden>
          <button id="upload-button">Upload route</button>
          <input id="upload-file" type="file" accept=".zip" hidden>
        </span>
      </div>
      <div class="sub" id="job-status"></div>
    </div>
    <button id="theme-toggle" title="Toggle light/dark theme" aria-label="Toggle light/dark theme">
      <svg id="theme-icon" viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor"
           stroke-width="2" stroke-linecap="round" stroke-linejoin="round"></svg>
    </button>
  </header>
  <div id="coverage"></div>
  <div id="segment-filters">
    <button class="chip critical" data-filter="critical">Critical</button>
    <button class="chip gap" data-filter="gap">Gap</button>
    <button class="chip uncovered" data-filter="uncovered">Not assessed</button>
    <span id="filter-status"></span>
  </div>
  <div id="segments"></div>
  <div id="map">
    <div id="map-grip" title="Drag to resize map">
      <svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor"
           stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
        <polyline points="15 3 21 3 21 9"></polyline>
        <polyline points="9 21 3 21 3 15"></polyline>
        <line x1="21" y1="3" x2="14" y2="10"></line>
        <line x1="3" y1="21" x2="10" y2="14"></line>
      </svg>
    </div>
  </div>
</aside>
<main><div class="empty" id="main-empty">Select a segment.</div></main>
</div>
<dialog id="details">
  <header>
    <h3 id="details-title"></h3>
    <button id="details-prev" title="Previous segment">&larr;</button>
    <button id="details-next" title="Next segment">&rarr;</button>
    <button id="details-close" aria-label="Close">&times;</button>
  </header>
  <div class="body">
    <div id="details-summary"></div>
    <p class="chart-title" id="details-overview-caption"></p>
    <div id="details-overview"></div>
    <p class="chart-title">This segment, with 30 m either side. Red line: the sample that set the flag.</p>
    <div id="chart-a"></div>
    <div id="chart-b"></div>
    <div id="chart-c"></div>
    <details id="details-samples"></details>
  </div>
</dialog>

<dialog id="config">
  <header>
    <h3>Thresholds</h3>
    <button id="config-apply" hidden>Apply and re-run</button>
    <button id="config-close" aria-label="Close">&times;</button>
  </header>
  <div class="body">
    <p class="sub" id="config-note"></p>
    <div id="config-error"></div>
    <table id="config-table"></table>
  </div>
</dialog>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="https://unpkg.com/uplot@1.6.31/dist/uPlot.iife.min.js"></script>
<script>
const MODULES = ["curvature", "grade", "delineation", "condition"];
const FLAG_COLOR = {
  normal: "#3fb950", watch: "#d29922",
  critical: "#f85149", not_assessed: "#6e7681",
};

const THEME_KEY = "irap-view-theme";
// Feather-style sun/moon icons: the icon shown is what clicking it switches
// *to*, so a moon shows while light and a sun shows while dark.
const THEME_ICON = {
  dark: `<circle cx="12" cy="12" r="4"></circle>
    <line x1="12" y1="2" x2="12" y2="4"></line><line x1="12" y1="20" x2="12" y2="22"></line>
    <line x1="4.22" y1="4.22" x2="5.64" y2="5.64"></line>
    <line x1="18.36" y1="18.36" x2="19.78" y2="19.78"></line>
    <line x1="2" y1="12" x2="4" y2="12"></line><line x1="20" y1="12" x2="22" y2="12"></line>
    <line x1="4.22" y1="19.78" x2="5.64" y2="18.36"></line>
    <line x1="18.36" y1="5.64" x2="19.78" y2="4.22"></line>`,
  light: `<path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path>`,
};

function applyTheme(theme) {
  document.documentElement.dataset.theme = theme;
  document.getElementById("theme-icon").innerHTML = THEME_ICON[theme];
  localStorage.setItem(THEME_KEY, theme);
}

function setupThemeToggle() {
  const stored = localStorage.getItem(THEME_KEY);
  const preferred = stored
    || (window.matchMedia("(prefers-color-scheme: light)").matches ? "light" : "dark");
  applyTheme(preferred);
  document.getElementById("theme-toggle").addEventListener("click", () => {
    applyTheme(document.documentElement.dataset.theme === "dark" ? "light" : "dark");
  });
}
setupThemeToggle();

const OVERLAY_KEY = "irap-view-overlay";
let overlayVisible = localStorage.getItem(OVERLAY_KEY) !== "hidden";

let data = null;
let selected = null;
let frameIndex = 0;
let map = null;
let layers = {};
let laneByFrame = new Map();
let signByFrame = new Map();
let routeList = [];
let currentRoute = null;

// Frame images and detection files live under the route's own directory,
// which a multi-route export scopes behind a /<route_id>/ URL segment (see
// serve.py's _resolve_multi_path). A single-route export has no such
// segment, so the prefix is empty and paths resolve exactly as before.
function routePrefix() {
  return currentRoute ? `${currentRoute}/` : "";
}

// The worst flag across the modules is what the list dot shows: a segment is as
// bad as its worst attribute, which is how iRAP aggregates within a unit.
const SEVERITY = ["not_assessed", "normal", "watch", "critical"];
function worstFlag(segment) {
  let worst = "not_assessed";
  for (const module of MODULES) {
    const flag = segment[module] && segment[module].flag;
    if (flag && SEVERITY.indexOf(flag) > SEVERITY.indexOf(worst)) worst = flag;
  }
  return worst;
}

// The list dot only shows the worst flag; this fills in which module(s) it
// came from as a hover tooltip -- plain text, so it scales to however many
// modules the pipeline grows to without adding more indicators to the row.
function flagSummary(segment) {
  return MODULES.map((module) => {
    const flag = (segment[module] && segment[module].flag) ?? "not_assessed";
    return `${module}: ${flagText(flag)}`;
  }).join(" · ");
}

// Display text only: the stored flag, and the CSS class built from it, stay
// "not_assessed".
function flagText(flag) {
  return flag ? flag.replace("_", " ") : "-";
}

// Display only: each stored metric gets a label and the unit a reader
// expects. A key not listed here still shows, with its underscores dropped.
const DEG_PER_RAD = 180 / Math.PI;
const METRIC_TEXT = {
  radius_m: (v) => `Curve radius ${Math.round(v)} m`,
  yaw_rate_rad_s: (v) => `Turn rate ${(v * DEG_PER_RAD).toFixed(1)}°/s`,
  mean_speed_mps: (v) => `Mean speed ${Math.round(v * 3.6)} km/h`,
  gyro_bias_rad_s: (v) => `Gyro bias ${(v * DEG_PER_RAD).toFixed(2)}°/s`,
  grade_pct: (v) => `Grade ${v.toFixed(1)}%`,
  pitch_deg: (v) => `Pitch ${v.toFixed(1)}°`,
  // The segment's minimum across its frames (lane.py), hence "lowest".
  weber_contrast: (v) => `Lowest marking contrast ${v.toFixed(2)} (Weber)`,
};
// Shown elsewhere (iRAP category column) or folded into one phrase below.
const UNLISTED_METRICS = new Set(
  ["irap_category", "detection_rate", "detected_frames", "total_frames"]);

function metricsOf(entry) {
  const parts = Object.entries(entry)
    .filter(([key, value]) => typeof value === "number" && !UNLISTED_METRICS.has(key))
    .map(([key, value]) => METRIC_TEXT[key]
      ? METRIC_TEXT[key](value)
      : `${key.replace(/_/g, " ")} ${Number(value.toFixed(3))}`);
  if (entry.total_frames != null) {
    parts.push(`Lanes detected in ${entry.detected_frames} of ${entry.total_frames} frames`
             + ` (${Math.round(entry.detection_rate * 100)}%)`);
  }
  return parts.join(" · ");
}

// iRAP's own descriptive band tables (Coding Manual). Display only -- these
// labels are read straight off entry.irap_category, which the Python layer
// already computed and tested; this is string formatting, not re-derivation.
const IRAP_CURVATURE_LABELS = {
  1: "1 - straight/gently curving (>800 m)",
  2: "2 - moderate (400-800 m)",
  3: "3 - sharp (200-400 m)",
  4: "4 - very sharp (<200 m)",
};
const IRAP_GRADE_LABELS = {
  1: "1 - flat/gentle (<7.5%)",
  4: "4 - moderate (7.5-<10%)",
  5: "5 - steep (>=10%)",
};
// Delineation has no independent numeric scale like curvature/grade's radius
// or percentage bands -- its code mirrors the flag one-for-one (see
// irap_delineation_category in lane.py). "lane marking:" qualifies it down
// to the part actually measured; iRAP's Delineation also covers hazard
// warning signs, which this project does not assess.
const IRAP_DELINEATION_LABELS = {
  1: "1 - lane marking: adequate",
  2: "2 - lane marking: poor",
};

function irapCategoryLabel(module, entry) {
  if (module === "curvature" && entry.irap_category != null) {
    return IRAP_CURVATURE_LABELS[entry.irap_category] ?? "-";
  }
  if (module === "grade" && entry.irap_category != null) {
    return IRAP_GRADE_LABELS[entry.irap_category] ?? "-";
  }
  if (module === "delineation" && entry.irap_category != null) {
    return IRAP_DELINEATION_LABELS[entry.irap_category] ?? "-";
  }
  return "-";
}

// generated_at is stored in UTC (report.py's own source of truth); the
// sidebar shows it in Malaysia time (UTC+8, no DST) since that is where this
// project is run and read.
function formatGeneratedAt(iso) {
  const date = new Date(iso);
  if (Number.isNaN(date.getTime())) return iso;
  const parts = new Intl.DateTimeFormat("en-GB", {
    timeZone: "Asia/Kuala_Lumpur",
    year: "numeric", month: "2-digit", day: "2-digit",
    hour: "2-digit", minute: "2-digit", second: "2-digit", hour12: false,
  }).formatToParts(date).reduce((acc, part) => ({ ...acc, [part.type]: part.value }), {});
  return `${parts.year}-${parts.month}-${parts.day} ${parts.hour}:${parts.minute}:${parts.second} UTC+8`;
}

// Chips are additive (OR): "problems only" usually means critical OR watch
// OR a missing mitigation, not an intersection of all three at once.
const activeFilters = new Set();

function segmentHasGap(segment) {
  return Boolean(segment.recommendations && segment.recommendations.length);
}

function segmentMatchesFilters(segment) {
  if (activeFilters.size === 0) return true;
  return activeFilters.has(worstFlag(segment))
    || (activeFilters.has("gap") && segmentHasGap(segment))
    || (activeFilters.has("uncovered") && segment.coverage === "uncovered");
}

function renderSegmentList() {
  document.getElementById("segments").innerHTML = data.segments.map((segment, i) => {
    if (!segmentMatchesFilters(segment)) return "";
    const flag = worstFlag(segment);
    const start = Math.round(segment.start_m), end = Math.round(segment.end_m);
    const hasGap = segmentHasGap(segment);
    return `<div class="seg${hasGap ? " has-gap" : ""}" data-i="${i}" title="${flagSummary(segment)}">`
         + `<span class="dot ${flag}"></span>`
         + `<span class="id">${segment.segment_id}</span>`
         + `<span class="range">${start}-${end} m</span></div>`;
  }).join("");

  document.querySelectorAll(".seg").forEach((node) => {
    node.addEventListener("click", () => select(Number(node.dataset.i)));
  });

  const status = document.getElementById("filter-status");
  if (activeFilters.size === 0) {
    status.textContent = "";
  } else {
    const shown = data.segments.filter(segmentMatchesFilters).length;
    status.textContent = `${shown} of ${data.segments.length}`;
  }
}

document.querySelectorAll("#segment-filters .chip").forEach((chip) => {
  chip.addEventListener("click", () => {
    const key = chip.dataset.filter;
    if (activeFilters.has(key)) activeFilters.delete(key); else activeFilters.add(key);
    chip.classList.toggle("active");
    renderSegmentList();
  });
});

function renderSidebar() {
  document.getElementById("route").textContent = `Route ${data.route_id}`;
  document.getElementById("generated").textContent =
    `${data.segments.length} segments · ${formatGeneratedAt(data.generated_at)}`;

  document.getElementById("coverage").innerHTML = MODULES.map((module) => {
    const cov = (data.coverage && data.coverage[module]) || {};
    const total = cov.total ?? 0;
    const missing = cov.not_assessed ?? 0;
    return `<div>${module} <span>${total - missing} of ${total} assessed`
         + (missing ? `, ${missing} not assessed` : "") + `</span></div>`;
  }).join("");

  renderSegmentList();
}

function renderMap() {
  // Switching routes calls this again on the same #map element; Leaflet
  // refuses to re-initialize a container it already owns, so the old
  // instance has to go first.
  if (map) {
    map.remove();
    map = null;
  }
  layers = {};
  document.getElementById("map").style.display = "";

  const points = data.segments.flatMap((s) => [s.start_latlon, s.end_latlon]);
  if (!points.length || typeof L === "undefined") {
    // Leaflet comes from a CDN; with no network the map is simply absent and
    // everything else still works.
    document.getElementById("map").style.display = "none";
    return;
  }
  map = L.map("map", { attributionControl: false });
  L.tileLayer("https://tile.openstreetmap.org/{z}/{x}/{y}.png", { maxZoom: 19 })
    .addTo(map);
  // Small white dots at each segment boundary make the 100 m breakpoints
  // visible against the colored route line, which otherwise reads as one
  // continuous strip.
  const boundaryMarker = (latlon) => L.circleMarker(latlon, {
    radius: 4, color: "#0f1114", weight: 1.5, fillColor: "#fff", fillOpacity: 1,
  }).addTo(map);
  data.segments.forEach((segment, i) => {
    const line = L.polyline([segment.start_latlon, segment.end_latlon], {
      color: FLAG_COLOR[worstFlag(segment)], weight: 5,
    }).addTo(map);
    line.bindTooltip(
      `${segment.segment_id} · ${Math.round(segment.start_m)}-${Math.round(segment.end_m)} m`,
      { sticky: true },
    );
    line.on("click", () => select(i));
    layers[i] = line;
    boundaryMarker(segment.start_latlon);
  });
  boundaryMarker(data.segments[data.segments.length - 1].end_latlon);
  map.fitBounds(L.latLngBounds(points).pad(0.2));
}

// Escapes a value for use inside an HTML attribute (the review note round-trips
// through value="..."); textContent-style escaping is not enough there.
function attrEscape(value) {
  return String(value).replace(/&/g, "&amp;").replace(/"/g, "&quot;");
}

// Review is only offered where there is something to review: a module the
// pipeline already scored has a flag, right or wrong, and disputing that
// belongs to code review, not this per-run annotation layer.
function reviewCell(segment, module, entry) {
  if (entry.flag !== "not_assessed") return "-";
  const review = (segment.review && segment.review[module]) || null;
  const verdict = review ? review.verdict : "";
  const note = review ? review.note : "";
  const status = review
    ? `<div class="review-status">saved: ${review.verdict === "ok" ? "OK" : "Flag"} &middot; `
      + `${new Date(review.reviewed_at).toLocaleString()}</div>`
    : "";
  return `<div class="review" data-module="${module}">`
       + `<select class="review-verdict">`
       + `<option value=""${verdict === "" ? " selected" : ""}>verdict...</option>`
       + `<option value="ok"${verdict === "ok" ? " selected" : ""}>OK</option>`
       + `<option value="flag"${verdict === "flag" ? " selected" : ""}>Flag</option>`
       + `</select>`
       + `<input class="review-note" type="text" placeholder="note" value="${attrEscape(note)}">`
       + `<button class="review-save">Save</button>`
       + status
       + `</div>`;
}

function moduleRows(segment) {
  return MODULES.map((module) => {
    const entry = segment[module] || {};
    const detail = entry.notes ? entry.notes : metricsOf(entry);
    return `<tr><td>${module}</td>`
         + `<td class="flag ${entry.flag}">${flagText(entry.flag)}</td>`
         + `<td class="metrics">${irapCategoryLabel(module, entry)}</td>`
         + `<td class="metrics">${detail}</td>`
         + `<td class="review-cell">${reviewCell(segment, module, entry)}</td>`
         + `<td>${detailsButton(module)}</td></tr>`;
  }).join("") + qualityOfCurveRow(segment);
}

const QUALITY_OF_CURVE_LABELS = { 1: "1 Adequate", 2: "2 Poor", 3: "3 Not applicable" };

// Derived from curvature, delineation and signs rather than scored, so it has
// no flag and no review of its own. Older reports lack the field entirely.
function qualityOfCurveRow(segment) {
  const quality = segment.quality_of_curve;
  if (!quality) return "";
  return `<tr><td>quality of curve</td><td>-</td>`
       + `<td class="metrics">${QUALITY_OF_CURVE_LABELS[quality.code] ?? "not assessed"}</td>`
       + `<td class="metrics">${quality.basis}</td><td></td><td></td></tr>`;
}

// Delegated on document: renderDetail() replaces the whole panel on every
// save and every segment switch, so a handler bound to the button itself
// would need rebinding after each render anyway.
document.addEventListener("click", (event) => {
  const button = event.target.closest(".review-save");
  if (!button) return;
  const segment = data.segments[selected];
  const container = button.closest(".review");
  const module = container.dataset.module;
  const verdict = container.querySelector(".review-verdict").value;
  const note = container.querySelector(".review-note").value;
  if (!verdict) return;

  button.disabled = true;
  fetch(`${routePrefix()}review`, {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ segment_id: segment.segment_id, module, verdict, note }),
  })
    .then((response) => {
      if (!response.ok) throw new Error(`save failed (${response.status})`);
      return response.json();
    })
    .then((entry) => {
      segment.review = segment.review || {};
      segment.review[module] = entry;
      renderDetail();
    })
    .catch((error) => {
      button.disabled = false;
      alert(`Could not save review: ${error.message}`);
    });
});

function doubleLineText(dl) {
  // The scan only runs on a critical-grade segment (gap-check's only use of
  // this value), so present=false is ambiguous without assessed: it means
  // either "scanned, none found" or "never scanned here".
  if (dl.assessed === false) return "not checked (grade not critical)";
  if (dl.present) return `present (confidence ${dl.confidence.toFixed(2)})`;
  return "absent";
}

function signsBlock(segment) {
  if (!segment.signs || !segment.signs.length) {
    const dl = segment.double_line || {};
    return `<p class="metrics">No signs accepted in this segment. `
         + `Double line: ${doubleLineText(dl)}`
         + `</p>`;
  }
  return `<table><tr><th>sign</th><th>confidence</th><th>distance along route</th></tr>`
       + segment.signs.map((sign) =>
           `<tr><td>${sign.cls === "other_sign" ? "Other sign" : sign.cls}</td>`
         + `<td class="metrics">${sign.conf.toFixed(2)}</td>`
         + `<td class="metrics">${Math.round(sign.at_m)} m</td></tr>`).join("")
       + `</table>`;
}

function recommendationsBlock(segment) {
  if (!segment.recommendations || !segment.recommendations.length) {
    return `<p class="metrics">No gap found: every matching mitigation is present.</p>`;
  }
  return segment.recommendations.map((rec) =>
    `<div class="rec"><div class="rule">${RULE_TITLE[rec.rule] ?? rec.rule}</div>`
  + `<div class="text">${recommendationText(rec)}</div></div>`).join("");
}

// Display only: the sentences are built from each recommendation's structured
// fields, worded no more strongly than gapcheck.py's rules check. A rule this
// page does not know falls back to gapcheck.py's own text.
const RULE_TITLE = {
  curve_warning_incomplete: "Curve warning incomplete",
  grade_overtaking_control_missing: "No overtaking control on a critical grade",
};
// The two curve signs are searched in different places: the advance sign in a
// window before the curve's entry, chevrons only within this segment.
const MITIGATION_TEXT = {
  advance_bend_sign: "an advance bend warning sign before the curve",
  chevron: "chevron alignment markers in this segment",
};

function listText(items, word) {
  if (items.length < 2) return items.join("");
  return `${items.slice(0, -1).join(", ")} ${word} ${items[items.length - 1]}`;
}

function recommendationText(rec) {
  const trigger = rec.trigger || {};
  const named = (keys) => keys.map((key) => MITIGATION_TEXT[key] ?? key);
  let text;
  if (rec.rule === "curve_warning_incomplete") {
    // radius_m is this segment's own; the start and end span the whole bend.
    // gapcheck.py writes 0 when the radius is missing, so it is left out then.
    const radius = trigger.radius_m
      ? ` Its radius in this segment is about ${Math.round(trigger.radius_m)} m.` : "";
    text = `This segment lies on a critical curve that runs from `
         + `${Math.round(trigger.curve_start_m)} m to ${Math.round(trigger.curve_end_m)} m `
         + `along the route.${radius} `
         + `The detector did not find ${listText(named(rec.missing), "or")}.`;
    if (rec.present.length) text += ` It did find ${listText(named(rec.present), "and")}.`;
  } else if (rec.rule === "grade_overtaking_control_missing") {
    const grade = trigger.grade_pct ? ` (${trigger.grade_pct.toFixed(1)}%)` : "";
    text = `This segment has a critical grade${grade}, and no overtaking control `
         + `was detected: neither a No overtaking sign nor a double centre line.`;
  } else {
    text = rec.text;
  }
  return text;
}

const LANE_COLOR = "#3fb950";
const SIGN_COLOR = "#d29922";
const SVG_NS = "http://www.w3.org/2000/svg";

function inFrame(x, y, width, height) {
  return x >= 0 && x < width && y >= 0 && y < height;
}

// Off-frame points are dropped rather than clamped. CLRerNet extends curved
// lanes past the image edge, and a clamped point would draw a marking along
// the border that was never detected there.
function drawLanes(svg, record, width, height) {
  const confThreshold = data.config.lane.clrernet_conf;
  for (const instance of record.instances) {
    if (instance.conf < confThreshold) continue;
    const points = instance.points.filter(([x, y]) => inFrame(x, y, width, height));
    if (points.length === 1) {
      const [x, y] = points[0];
      const circle = document.createElementNS(SVG_NS, "circle");
      circle.setAttribute("cx", x);
      circle.setAttribute("cy", y);
      circle.setAttribute("r", 4);
      circle.setAttribute("fill", LANE_COLOR);
      svg.appendChild(circle);
    } else if (points.length > 1) {
      const polyline = document.createElementNS(SVG_NS, "polyline");
      polyline.setAttribute("points", points.map(([x, y]) => `${x},${y}`).join(" "));
      polyline.setAttribute("fill", "none");
      polyline.setAttribute("stroke", LANE_COLOR);
      polyline.setAttribute("stroke-width", 3);
      polyline.setAttribute("vector-effect", "non-scaling-stroke");
      svg.appendChild(polyline);
    }
  }
}

// The class string is what gap-check matches on, so it is shown with the
// confidence that decided whether it was accepted at all.
function drawSigns(svg, record, width) {
  const confThreshold = data.config.sign.conf;
  const fontSize = Math.max(12, width / 64);
  for (const instance of record.instances) {
    if (instance.conf < confThreshold) continue;
    const [x1, y1, x2, y2] = instance.bbox;
    const x = Math.min(x1, x2);
    const y = Math.min(y1, y2);
    const w = Math.abs(x2 - x1);
    const h = Math.abs(y2 - y1);
    const rect = document.createElementNS(SVG_NS, "rect");
    rect.setAttribute("x", x);
    rect.setAttribute("y", y);
    rect.setAttribute("width", w);
    rect.setAttribute("height", h);
    rect.setAttribute("fill", "none");
    rect.setAttribute("stroke", SIGN_COLOR);
    rect.setAttribute("stroke-width", 3);
    rect.setAttribute("vector-effect", "non-scaling-stroke");
    svg.appendChild(rect);

    const label = document.createElementNS(SVG_NS, "text");
    label.setAttribute("x", x);
    label.setAttribute("y", Math.max(y - 6, 12));
    label.setAttribute("fill", SIGN_COLOR);
    label.setAttribute("font-size", fontSize);
    label.textContent = `${instance.cls || "?"} ${instance.conf.toFixed(2)}`;
    svg.appendChild(label);
  }
}

function drawOverlay(svg, width, height, frameId) {
  svg.setAttribute("viewBox", `0 0 ${width} ${height}`);
  svg.innerHTML = "";
  const lane = laneByFrame.get(frameId);
  if (lane) drawLanes(svg, lane, width, height);
  const sign = signByFrame.get(frameId);
  if (sign) drawSigns(svg, sign, width);
}

// Stepping frames swaps the image in place rather than rebuilding the panel.
// Rebuilding scrolls back to the top, and restoring scrollTop afterwards does
// not work: the new image has not loaded yet, so the panel is momentarily too
// short and the assignment is clamped.
function showFrame() {
  const frames = data.segments[selected].frame_ids || [];
  const image = document.getElementById("frame-img");
  const overlay = document.getElementById("frame-overlay");
  if (!image || !overlay) return;
  const frameId = frames[frameIndex];
  overlay.classList.toggle("hidden", !overlayVisible);
  image.onload = () => drawOverlay(overlay, image.naturalWidth, image.naturalHeight, frameId);
  image.src = routePrefix() + data.frames[frameId];
  image.alt = frameId;
  document.getElementById("frame-caption").innerHTML =
    `<code>${frameId}</code> · frame ${frameIndex + 1} of ${frames.length}`;
  document.getElementById("prev").disabled = frameIndex === 0;
  document.getElementById("next").disabled = frameIndex >= frames.length - 1;
}

function step(delta) {
  const frames = data.segments[selected].frame_ids || [];
  const next = frameIndex + delta;
  if (next < 0 || next >= frames.length) return;
  frameIndex = next;
  showFrame();
}

function renderDetail() {
  const segment = data.segments[selected];
  const frames = segment.frame_ids || [];
  document.querySelector("main").innerHTML = `
    <h2>Evidence</h2>
    ${frames.length
      ? `<figure>
           <div class="frame-wrap">
             <img id="frame-img" alt="">
             <svg id="frame-overlay" class="overlay"></svg>
           </div>
           <figcaption>
             <button id="prev">&larr;</button>
             <button id="next">&rarr;</button>
             <span id="frame-caption"></span>
             <span>green = lane points, amber = signs</span>
             <label><input type="checkbox" id="overlay-toggle"> show markers</label>
           </figcaption>
         </figure>`
      : `<p class="metrics">No frames fall within this segment.</p>`}
    <h2>${segment.segment_id} · ${Math.round(segment.start_m)}-${Math.round(segment.end_m)} m</h2>
    <table><tr><th>module</th><th>flag</th><th>iRAP category</th><th>metrics</th><th>review</th><th>evidence</th></tr>
      ${moduleRows(segment)}</table>
    <h2>Signs and markings</h2>
    ${signsBlock(segment)}
    <h2>Recommendations</h2>
    ${recommendationsBlock(segment)}
  `;
  if (frames.length) {
    document.getElementById("prev").addEventListener("click", () => step(-1));
    document.getElementById("next").addEventListener("click", () => step(1));
    const overlayToggle = document.getElementById("overlay-toggle");
    overlayToggle.checked = overlayVisible;
    overlayToggle.addEventListener("change", () => {
      overlayVisible = overlayToggle.checked;
      localStorage.setItem(OVERLAY_KEY, overlayVisible ? "shown" : "hidden");
      document.getElementById("frame-overlay").classList.toggle("hidden", !overlayVisible);
    });
    showFrame();
  }
}

function select(index) {
  selected = index;
  frameIndex = 0;
  document.querySelectorAll(".seg").forEach((node) => {
    const active = Number(node.dataset.i) === index;
    node.classList.toggle("active", active);
    // The details overview can select a segment far down the list.
    if (active) node.scrollIntoView({ block: "nearest" });
  });
  if (detailsDialog.open && detailCharts.length) renderDetails();
  if (map && layers[index]) map.fitBounds(layers[index].getBounds().pad(1.5));
  renderDetail();
}

// One grip in the map's top-right corner drives both dimensions: sidebar
// width grows from its left edge (fixed at the window edge), map height
// grows from its bottom edge (fixed at the bottom of the sidebar). Moving
// the mouse along only one axis leaves the other dimension unchanged, so a
// straight drag resizes just width or just height, and a diagonal drag
// resizes both. Leaflet caches its container size, so nudge it after each
// change or the tiles misalign.
function setupResizeHandles() {
  const sidebar = document.querySelector("aside");
  const mapEl = document.getElementById("map");
  const grip = document.getElementById("map-grip");
  let dragging = false;

  function onMove(event) {
    if (!dragging) return;
    const width = Math.min(Math.max(event.clientX, 260), window.innerWidth - 320);
    const height = Math.min(Math.max(sidebar.getBoundingClientRect().bottom - event.clientY, 120), 600);
    sidebar.style.width = `${width}px`;
    mapEl.style.height = `${height}px`;
    if (map) map.invalidateSize();
  }

  function onUp() {
    if (!dragging) return;
    dragging = false;
    grip.classList.remove("active");
    document.body.style.cursor = "";
  }

  grip.addEventListener("mousedown", (event) => {
    dragging = true;
    grip.classList.add("active");
    document.body.style.cursor = "nesw-resize";
    event.preventDefault();
    event.stopPropagation();
  });
  document.addEventListener("mousemove", onMove);
  document.addEventListener("mouseup", onUp);
}

// Curvature and grade details: the chain from IMU samples to the segment's
// flag, built from the per-sample series export.py writes (build_profile) with
// the same functions the modules use. A modal, so the page behind is inert
// while it is open: the theme and the route cannot change under it.
const detailsDialog = document.getElementById("details");
const CONTEXT_M = 30;  // shown either side of the segment, to see the approach and exit
let detailCharts = [];
let overviewChart = null;
let detailsModule = "curvature";

function detailsButton(module) {
  // A data.json exported before a module's series existed gets no button.
  const ready = { curvature: data.profile?.radius_m, grade: data.profile?.pitch_deg };
  if (!ready[module]) return "";
  return `<button class="details-open" data-module="${module}">Details</button>`;
}

function cssVar(name) {
  return getComputedStyle(document.documentElement).getPropertyValue(name).trim();
}

function segmentAt(dist) {
  return data.segments.findIndex((s) => dist >= s.start_m && dist < s.end_m);
}

// Curvature in 1/km. Plotted instead of radius: a straight road's radius runs
// to infinity and off any axis, while its curvature is simply near zero.
function kappa(radius) {
  return radius == null ? null : 1000 / radius;
}

// Tick positions on the iRAP radius bands. The threshold is always labelled;
// the others only where they would not overlap a label already placed.
function radiusSplits(kMax, threshold) {
  const kept = [0, threshold];
  for (const k of [1.25, 2.5, 5, 10, 20, 50]) {
    if (k <= kMax && kept.every((other) => Math.abs(other - k) >= kMax / 8)) kept.push(k);
  }
  return kept.sort((a, b) => a - b);
}

function radiusLabel(k) {
  return k === 0 ? "straight" : `R ${Math.round(1000 / k)} m`;
}

// The sample that set the flag: the smallest radius within the segment, as
// analyse_curvature takes it (first occurrence on a tie, as numpy's argmin).
function decidingSample() {
  const segment = data.segments[selected];
  const { dist_m: dist, radius_m: radius } = data.profile;
  let best = -1;
  for (let i = 0; i < dist.length; i++) {
    if (dist[i] < segment.start_m || dist[i] >= segment.end_m || radius[i] == null) continue;
    if (best < 0 || radius[i] < radius[best]) best = i;
  }
  return best;
}

function summaryHtml(entry, i) {
  const t = data.config.curvature;
  if (entry.flag === "not_assessed" || i < 0) {
    return `<p><b>Not assessed.</b> ${entry.notes ?? ""}</p>`;
  }
  const p = data.profile;
  const bias = entry.gyro_bias_rad_s ?? 0;
  const yaw = Math.abs(p.yaw_rate_rad_s[i] - bias);
  const verdict = entry.flag === "critical"
    ? `<b class="critical">Critical:</b> the tightest radius, ${Math.round(entry.radius_m)} m, is below the ${t.threshold_m} m threshold.`
    : `<b class="normal">Normal:</b> the tightest radius, ${Math.round(entry.radius_m)} m, is at or above the ${t.threshold_m} m threshold.`;
  return `<p>${verdict}</p>`
    + `<p class="calc">At ${Math.round(p.dist_m[i])} m (t = ${p.time_s[i].toFixed(1)} s): `
    + `radius = speed ÷ |yaw rate| = ${p.speed_mps[i].toFixed(2)} m/s ÷ ${yaw.toFixed(4)} rad/s `
    + `= ${Math.round(entry.radius_m)} m.<br>`
    // estimate_gyro_bias returns exactly 0 when the route has no stationary window.
    + (bias === 0
      ? `Yaw rate is the raw gyro z reading, uncorrected: the route has no stationary `
        + `window to estimate the gyro bias from. `
      : `Yaw rate is the raw gyro z reading ${p.yaw_rate_rad_s[i].toFixed(4)} rad/s minus the gyro bias `
        + `${bias.toFixed(4)} rad/s, estimated once for the route from stationary samples. `)
    + `Samples below ${t.v_min_mps} m/s (${Math.round(t.v_min_mps * 3.6)} km/h) are left out: `
    + `radius is undefined as speed approaches zero.</p>`;
}

// Draws behind the series: the segment shaded, its boundaries, and any
// horizontal reference lines; on top, a vertical line at the deciding sample.
function shadeHooks(lines, deciding, band = null) {
  const dpr = uPlot.pxRatio;
  return {
    drawAxes: [(u) => {
      const { left, top, width, height } = u.bbox;
      const segment = data.segments[selected];
      const ctx = u.ctx;
      ctx.save();
      ctx.beginPath(); ctx.rect(left, top, width, height); ctx.clip();
      const x0 = u.valToPos(segment.start_m, "x", true);
      const x1 = u.valToPos(segment.end_m, "x", true);
      ctx.fillStyle = cssVar("--active-bg");
      ctx.fillRect(x0, top, x1 - x0, height);
      if (band) {
        const b0 = u.valToPos(band[0], "x", true), b1 = u.valToPos(band[1], "x", true);
        ctx.globalAlpha = 0.18;
        ctx.fillStyle = cssVar("--critical");
        ctx.fillRect(b0, top, Math.max(b1 - b0, dpr), height);
        ctx.globalAlpha = 1;
      }
      ctx.lineWidth = dpr;
      ctx.setLineDash([5 * dpr, 4 * dpr]);
      for (const line of lines) {
        const y = u.valToPos(line.value, "y", true);
        ctx.strokeStyle = line.color;
        ctx.beginPath(); ctx.moveTo(left, y); ctx.lineTo(left + width, y); ctx.stroke();
      }
      ctx.restore();
    }],
    draw: [(u) => {
      if (deciding == null) return;
      const { top, height } = u.bbox;
      const x = u.valToPos(deciding, "x", true);
      const ctx = u.ctx;
      ctx.save();
      ctx.strokeStyle = cssVar("--critical");
      ctx.lineWidth = dpr;
      ctx.beginPath(); ctx.moveTo(x, top); ctx.lineTo(x, top + height); ctx.stroke();
      ctx.restore();
    }],
  };
}

function baseAxis(extra) {
  const grid = cssVar("--line");
  return {
    stroke: cssVar("--muted"), grid: { stroke: grid, width: 1 },
    ticks: { stroke: grid, width: 1 }, size: 70, ...extra,
  };
}

// One detail chart: a window of the route, its own y range fitted to it.
function detailChart(el, series, axis, lines, deciding, cols, range = null, band = null) {
  const xAxis = baseAxis({ size: 40, values: (u, ticks) => ticks.map((v) => `${v} m`) });
  return new uPlot({
    width: el.clientWidth, height: 150,
    cursor: { sync: { key: "details" }, drag: { x: false, y: false } },
    legend: { show: true },
    scales: { x: { time: false }, ...(range ? { y: { range } } : {}) },
    axes: [xAxis, baseAxis(axis)],
    // uPlot draws sample dots only when the samples are sparse, i.e. when the
    // car is fast; that read as a normal/critical difference, so never draw them.
    series: [{ label: "Distance", value: (u, v) => (v == null ? "-" : `${v.toFixed(1)} m`) },
             ...series.map((s) => ({ ...s, points: { show: false } }))],
    hooks: shadeHooks(lines, deciding, band),
  }, cols, el);
}

// The overview's shading plus a strip along the top, one block per segment in
// the open module's flag colour, so the route's critical stretches read at a glance.
function overviewHooks() {
  const hooks = shadeHooks([], null);
  hooks.drawAxes.push((u) => {
    const { top } = u.bbox;
    const dpr = uPlot.pxRatio;
    const colour = { critical: "--critical", normal: "--normal" };
    const ctx = u.ctx;
    ctx.save();
    for (const segment of data.segments) {
      const x0 = u.valToPos(segment.start_m, "x", true);
      const x1 = u.valToPos(segment.end_m, "x", true);
      ctx.fillStyle = cssVar(colour[segment[detailsModule]?.flag] || "--unassessed");
      ctx.fillRect(x0, top, Math.max(x1 - x0 - dpr, dpr), 6 * dpr);
    }
    ctx.restore();
  });
  return hooks;
}

function renderOverview() {
  const el = document.getElementById("details-overview");
  overviewChart?.destroy();
  const p = data.profile;
  overviewChart = new uPlot({
    width: el.clientWidth, height: 80,
    cursor: { drag: { x: false, y: false }, points: { show: false } },
    legend: { show: false },
    // Headroom above the highest peak keeps the line clear of the flag strip.
    scales: { x: { time: false }, y: { range: (u, min, max) => {
      const floor = Math.min(0, min);
      return [floor, max + (max - floor) * 0.35];
    } } },
    axes: [baseAxis({ size: 24, values: (u, ticks) => ticks.map((v) => `${v} m`) }),
           baseAxis({ show: false, size: 70 })],
    series: [{}, { stroke: cssVar("--muted"), width: 1, points: { show: false } }],
    hooks: overviewHooks(),
  }, [p.dist_m, detailsModule === "grade" ? p.grade_pct : p.radius_m.map(kappa)], el);
  // The overview is the route-level navigation: a click opens that segment.
  overviewChart.over.addEventListener("click", () => {
    const i = segmentAt(overviewChart.posToVal(overviewChart.cursor.left, "x"));
    if (i >= 0) select(i);
  });
}

function renderDetails() {
  const segment = data.segments[selected];
  const name = detailsModule === "grade" ? "Grade" : "Curvature";
  document.getElementById("details-title").textContent =
    `${name} details · ${segment.segment_id} (${Math.round(segment.start_m)}-${Math.round(segment.end_m)} m)`;
  document.getElementById("details-prev").disabled = selected === 0;
  document.getElementById("details-next").disabled = selected === data.segments.length - 1;
  overviewChart.redraw(false);

  // The window: the segment plus context either side.
  const p = data.profile;
  const lo = segment.start_m - CONTEXT_M, hi = segment.end_m + CONTEXT_M;
  const idx = [];
  p.dist_m.forEach((d, k) => { if (d >= lo && d <= hi) idx.push(k); });
  const pick = (values, f = (v) => v) => idx.map((k) => (values[k] == null ? null : f(values[k])));
  detailCharts.forEach((chart) => chart.destroy());
  (detailsModule === "grade" ? renderGradeDetails : renderCurvatureDetails)(segment, pick, pick(p.dist_m));
}

function renderCurvatureDetails(segment, pick, dist) {
  const entry = segment.curvature || {};
  const p = data.profile;
  const t = data.config.curvature;
  const i = decidingSample();
  const bias = entry.gyro_bias_rad_s ?? 0;
  document.getElementById("details-summary").innerHTML = summaryHtml(entry, i);

  const deg = (v) => v * 180 / Math.PI;
  const deciding = i >= 0 ? p.dist_m[i] : null;
  const faint = cssVar("--border2"), critical = cssVar("--critical"), text = cssVar("--text");

  const kMax = Math.max(5.5, ...pick(p.radius_m, kappa).filter((v) => v != null)) * 1.1;
  detailCharts = [
    detailChart(document.getElementById("chart-a"), [
      { label: "Yaw rate, raw", stroke: faint, width: 1, value: (u, v) => (v == null ? "-" : `${v.toFixed(2)}°/s`) },
      { label: "Yaw rate, bias removed", stroke: text, width: 1.5, value: (u, v) => (v == null ? "-" : `${v.toFixed(2)}°/s`) },
    ], { values: (u, ticks) => ticks.map((v) => `${v}°/s`) }, [{ value: 0, color: faint }], deciding,
    [dist, pick(p.yaw_rate_rad_s, deg), pick(p.yaw_rate_rad_s, (v) => deg(v - bias))]),

    detailChart(document.getElementById("chart-b"), [
      { label: "Speed", stroke: text, width: 1.5, value: (u, v) => (v == null ? "-" : `${v.toFixed(1)} km/h`) },
    ], { values: (u, ticks) => ticks.map((v) => `${v} km/h`) },
    [{ value: t.v_min_mps * 3.6, color: critical }], deciding,
    [dist, pick(p.speed_mps, (v) => v * 3.6)]),

    detailChart(document.getElementById("chart-c"), [
      { label: "Curvature", stroke: text, width: 1.5,
        value: (u, v, s, k) => (k == null ? "-" : v == null ? "below min speed"
          : `${v.toFixed(2)} /km (R ${Math.round(1000 / v)} m)`) },
    ], {
      // Ticks sit on the iRAP radius bands, labelled as radius.
      splits: () => radiusSplits(kMax, 1000 / t.threshold_m),
      values: (u, ticks) => ticks.map(radiusLabel),
    }, [
      { value: 1000 / 800, color: faint },
      { value: 1000 / t.threshold_m, color: critical },
      { value: 1000 / 200, color: faint },
    ], deciding,
    [dist, pick(p.radius_m, kappa)], () => [0, kMax]),
  ];

  // Samples within the segment itself, the ones the flag was taken over.
  const rows = [];
  for (let k = 0; k < p.dist_m.length; k++) {
    if (p.dist_m[k] < segment.start_m || p.dist_m[k] >= segment.end_m) continue;
    const used = p.radius_m[k] != null;
    rows.push(`<tr class="${k === i ? "deciding" : ""}${used ? "" : " gated"}">`
      + `<td>${p.dist_m[k].toFixed(1)}</td><td>${p.time_s[k].toFixed(2)}</td>`
      + `<td>${deg(p.yaw_rate_rad_s[k]).toFixed(2)}</td><td>${deg(p.yaw_rate_rad_s[k] - bias).toFixed(2)}</td>`
      + `<td>${(p.speed_mps[k] * 3.6).toFixed(1)}</td>`
      + `<td>${used ? (p.radius_m[k] >= 1e5 ? "straight" : Math.round(p.radius_m[k])) : "-"}</td>`
      + `<td>${used ? "yes" : "no, below min speed"}</td></tr>`);
  }
  document.getElementById("details-samples").innerHTML =
    `<summary>Samples in this segment (${rows.length})</summary>`
    + `<table><tr><th>Distance (m)</th><th>Time (s)</th><th>Yaw raw (°/s)</th>`
    + `<th>Yaw, bias removed (°/s)</th><th>Speed (km/h)</th><th>Radius (m)</th><th>Used</th></tr>`
    + rows.join("") + `</table>`;
}

// Grade details: pitch from the accelerometer (with the vehicle's own
// acceleration removed) fused with the gyro, then the steepest grade held for
// a tenth of the segment. The window and the deciding sample come from
// export.py (grade_windows), which runs analyse_grade's own search.
function gradeSummaryHtml(segment, entry) {
  const t = data.config.grade, w = segment.grade_window;
  if (entry.flag === "not_assessed" || !w) {
    return `<p><b>Not assessed.</b> ${entry.notes ?? ""}</p>`;
  }
  const p = data.profile, i = w.index, g = entry.grade_pct;
  const minLength = data.config.segment.length_m / 10;
  const alpha = t.comp_filter_alpha;
  const verdict = entry.flag === "critical"
    ? `<b class="critical">Critical:</b> the steepest grade held for ${minLength} m, ${g.toFixed(1)}%, is at or beyond the ±${t.threshold_pct}% threshold.`
    : `<b class="normal">Normal:</b> the steepest grade held for ${minLength} m, ${g.toFixed(1)}%, is within the ±${t.threshold_pct}% threshold.`;
  return `<p>${verdict}</p>`
    + `<p class="calc">At ${Math.round(p.dist_m[i])} m (t = ${p.time_s[i].toFixed(1)} s): `
    + `grade = tan(pitch) × 100 = tan(${p.pitch_deg[i].toFixed(2)}°) × 100 = ${g.toFixed(2)}%.<br>`
    + (w.fallback
      ? `The segment's samples span less than ${minLength} m, so its single steepest sample is taken.<br>`
      : `From ${w.start_m} m to ${w.end_m} m (tinted) the grade stays at ${Math.abs(g).toFixed(2)}% or steeper: `
        + `the steepest gradient at least ${minLength} m long, as the iRAP Coding Manual records it, `
        + `so a shorter spike (a speed bump, a culvert) does not set the grade.<br>`)
    + `Pitch is a complementary filter: ${alpha} × (previous pitch + gyro pitch rate × dt) `
    + `+ ${(1 - alpha).toFixed(2)} × the accelerometer's pitch. The accelerometer reads the vehicle's own `
    + `acceleration in the same channel as the slope, so it is removed first, taken from the change in `
    + `recorded speed: here ${p.long_accel_mps2[i].toFixed(2)} m/s², without which this sample's `
    + `accelerometer pitch would read ${p.pitch_accel_raw_deg[i].toFixed(2)}° instead of `
    + `${p.pitch_accel_deg[i].toFixed(2)}°.</p>`;
}

function renderGradeDetails(segment, pick, dist) {
  const entry = segment.grade || {};
  const w = segment.grade_window;
  const p = data.profile;
  const t = data.config.grade;
  const assessed = entry.flag !== "not_assessed" && w;
  document.getElementById("details-summary").innerHTML = gradeSummaryHtml(segment, entry);

  const deciding = assessed ? p.dist_m[w.index] : null;
  const band = assessed && !w.fallback ? [w.start_m, w.end_m] : null;
  const faint = cssVar("--border2"), muted = cssVar("--muted"), critical = cssVar("--critical"), text = cssVar("--text");
  const fmt = (unit, digits) => (u, v) => (v == null ? "-" : `${v.toFixed(digits)}${unit}`);
  detailCharts = [
    detailChart(document.getElementById("chart-a"), [
      { label: "Accelerometer pitch, uncorrected", stroke: faint, width: 1, value: fmt("°", 2) },
      { label: "Accelerometer pitch, acceleration removed", stroke: muted, width: 1, value: fmt("°", 2) },
      { label: "Fused pitch", stroke: text, width: 1.5, value: fmt("°", 2) },
    ], { values: (u, ticks) => ticks.map((v) => `${v}°`) }, [{ value: 0, color: faint }], deciding,
    [dist, pick(p.pitch_accel_raw_deg), pick(p.pitch_accel_deg), pick(p.pitch_deg)]),

    detailChart(document.getElementById("chart-b"), [
      { label: "Longitudinal acceleration, from speed", stroke: text, width: 1.5, value: fmt(" m/s²", 2) },
    ], { values: (u, ticks) => ticks.map((v) => `${v} m/s²`) }, [{ value: 0, color: faint }], deciding,
    [dist, pick(p.long_accel_mps2)]),

    detailChart(document.getElementById("chart-c"), [
      { label: "Grade", stroke: text, width: 1.5, value: fmt("%", 2) },
    ], {
      // Labelled at the thresholds: uPlot's own ticks skip them on a short chart.
      splits: () => [-t.threshold_pct, 0, t.threshold_pct],
      values: (u, ticks) => ticks.map((v) => `${v}%`),
    }, [
      { value: t.threshold_pct, color: critical },
      { value: 0, color: faint },
      { value: -t.threshold_pct, color: critical },
    ], deciding,
    [dist, pick(p.grade_pct)],
    // Keep both thresholds in view, so a flat road reads as flat.
    (u, min, max) => [Math.min(min, -t.threshold_pct * 1.15), Math.max(max, t.threshold_pct * 1.15)],
    band),
  ];

  const rows = [];
  for (let k = 0; k < p.dist_m.length; k++) {
    if (p.dist_m[k] < segment.start_m || p.dist_m[k] >= segment.end_m) continue;
    const inWindow = band && p.dist_m[k] >= w.start_m && p.dist_m[k] <= w.end_m;
    rows.push(`<tr class="${assessed && k === w.index ? "deciding" : ""}${inWindow ? " window" : ""}">`
      + `<td>${p.dist_m[k].toFixed(1)}</td><td>${p.time_s[k].toFixed(2)}</td>`
      + `<td>${p.accel_x_mps2[k].toFixed(3)}</td><td>${p.long_accel_mps2[k].toFixed(3)}</td>`
      + `<td>${p.pitch_accel_raw_deg[k].toFixed(2)}</td><td>${p.pitch_accel_deg[k].toFixed(2)}</td>`
      + `<td>${p.pitch_rate_deg_s[k].toFixed(3)}</td><td>${p.pitch_deg[k].toFixed(2)}</td>`
      + `<td>${p.grade_pct[k].toFixed(2)}</td><td>${inWindow ? "yes" : ""}</td></tr>`);
  }
  document.getElementById("details-samples").innerHTML =
    `<summary>Samples in this segment (${rows.length})</summary>`
    + `<table><tr><th>Distance (m)</th><th>Time (s)</th><th>Accel x (m/s²)</th>`
    + `<th>Longitudinal accel (m/s²)</th><th>Accel pitch, uncorrected (°)</th>`
    + `<th>Accel pitch, corrected (°)</th><th>Gyro pitch rate (°/s)</th><th>Fused pitch (°)</th>`
    + `<th>Grade (%)</th><th>In ${data.config.segment.length_m / 10} m window</th></tr>`
    + rows.join("") + `</table>`;
}

function openDetails(module) {
  detailsModule = module;
  document.getElementById("details-overview-caption").textContent =
    `Whole route: ${module}. Top strip: each segment's ${module} flag (green normal, red critical, `
    + "grey not assessed). Shaded: this segment. Click to open another segment.";
  detailsDialog.showModal();
  if (typeof uPlot === "undefined") {
    // uPlot comes from a CDN, like Leaflet; offline, the summary still shows.
    document.getElementById("details-overview").textContent =
      "Charts unavailable: the chart library could not be loaded (offline?).";
    return;
  }
  renderOverview();
  renderDetails();
}

document.addEventListener("click", (event) => {
  const button = event.target.closest(".details-open");
  if (button) openDetails(button.dataset.module);
});
document.getElementById("details-close").addEventListener("click", () => detailsDialog.close());
document.getElementById("details-prev").addEventListener("click", () => select(selected - 1));
document.getElementById("details-next").addEventListener("click", () => select(selected + 1));
detailsDialog.addEventListener("close", () => {
  detailCharts.forEach((chart) => chart.destroy());
  detailCharts = [];
  overviewChart?.destroy();
  overviewChart = null;
});

document.addEventListener("keydown", (event) => {
  if (selected === null || configDialog.open) return;
  if (event.key === "ArrowLeft") step(-1);
  if (event.key === "ArrowRight") step(1);
});

function parseJsonl(text) {
  const map = new Map();
  for (const line of text.split("\n")) {
    const trimmed = line.trim();
    if (!trimmed) continue;
    const record = JSON.parse(trimmed);
    map.set(record.frame_id, record);
  }
  return map;
}

// A missing file (no sign detector run yet, say) is a valid state: it reads
// as an empty map, the same way load_detections() in Python treats a
// missing path as {} rather than an error.
function fetchJsonl(path) {
  return fetch(path)
    .then((response) => (response.ok ? response.text() : ""))
    .then(parseJsonl);
}

const ROUTE_KEY = "irap-view-route";

function renderRouteSwitcher() {
  const select = document.getElementById("route-select");
  // A single-route export never wrote routes.json, so there is nothing to
  // switch between; a scanned directory of exactly one route still could,
  // but showing a one-item switcher would just be noise.
  if (routeList.length < 2) {
    select.style.display = "none";
    return;
  }
  select.style.display = "block";
  select.innerHTML = routeList
    .map((route) => `<option value="${route.id}">${route.label}</option>`)
    .join("");
  select.value = currentRoute;
}

function loadRoute(routeId) {
  currentRoute = routeId;
  if (routeId) localStorage.setItem(ROUTE_KEY, routeId);
  renderRouteSwitcher();

  const prefix = routePrefix();
  return Promise.all([
    fetch(`${prefix}data.json`).then((response) => response.json()),
    fetchJsonl(`${prefix}detections/lane.jsonl`),
    fetchJsonl(`${prefix}detections/sign.jsonl`),
  ]).then(([payload, laneMap, signMap]) => {
    data = payload;
    laneByFrame = laneMap;
    signByFrame = signMap;
    selected = null;
    frameIndex = 0;
    renderSidebar();
    renderMap();
    if (data.segments.length) {
      select(0);
    } else {
      document.querySelector("main").innerHTML =
        '<div class="empty" id="main-empty">Select a segment.</div>';
    }
  });
}

document.getElementById("route-select").addEventListener("change", (event) => {
  loadRoute(event.target.value);
});

// Upload exists only when the server can run the detectors; the server says
// so in /job. A server with no jobs at all answers /job with 404.
const uploadButton = document.getElementById("upload-button");
const uploadFile = document.getElementById("upload-file");
const uploadStatus = document.getElementById("job-status");
// Reload only for a job this page watched finish; otherwise a job that ended
// earlier would reload the page every time it opened.
let jobWatched = false;

function showJob(job) {
  document.getElementById("upload").hidden = !job.upload;
  const name = job.kind === "config" ? "Thresholds" : job.route_id;
  const running = job.state === "running";
  uploadButton.disabled = running;
  configApply.disabled = running;
  if (running) {
    jobWatched = true;
    const last = job.log.length ? ` - ${job.log[job.log.length - 1]}` : "";
    uploadStatus.textContent = `${name}: ${job.label} (${job.step}/${job.steps})${last}`;
    setTimeout(pollJob, 1000);
    return;
  }
  if (job.state === "failed") {
    uploadStatus.textContent = `${name}: ${job.label} failed - ${job.error}`;
  } else if (job.state === "done" && jobWatched) {
    jobWatched = false;
    if (job.kind === "config") {
      // Stay on the route and segment being looked at.
      uploadStatus.textContent = "Thresholds applied; every route's report re-ran.";
      const keep = selected;
      loadRoute(currentRoute).then(() => {
        if (keep !== null && keep < data.segments.length) select(keep);
      });
      return;
    }
    localStorage.setItem(ROUTE_KEY, job.route_id);
    location.reload();
  }
}

function pollJob() {
  fetch("job")
    .then((response) => (response.ok ? response.json() : null))
    .then((job) => { if (job) showJob(job); })
    .catch(() => setTimeout(pollJob, 1000));
}

uploadButton.addEventListener("click", () => uploadFile.click());
uploadFile.addEventListener("change", () => {
  const file = uploadFile.files[0];
  if (!file) return;
  uploadFile.value = "";
  uploadButton.disabled = true;
  uploadStatus.textContent = `Uploading ${file.name}...`;
  const name = file.name.replace(/\.zip$/i, "");
  fetch(`upload?name=${encodeURIComponent(name)}`, {
    method: "POST",
    headers: { "Content-Type": "application/zip" },
    body: file,
  })
    .then((response) => {
      if (!response.ok) throw new Error(response.statusText);
      return response.json();
    })
    .then(showJob)
    .catch((error) => {
      uploadButton.disabled = false;
      uploadStatus.textContent = `Upload refused: ${error.message}`;
    });
});

// Thresholds: what every flag on this page was decided with. Under `irap view`
// over a directory of routes the server lists them with their sources (GET
// /config) and can re-run the report under changed ones (POST /config); on any
// other server the table is read-only, from this route's data.json.
const configDialog = document.getElementById("config");
const configApply = document.getElementById("config-apply");
const configError = document.getElementById("config-error");
const CONFIG_NOTES = {
  "lane.clrernet_conf": "Lowering it below the floor of the cached lane dump has no effect.",
  "segment.length_m": "Also sets grade's sustained window, a tenth of this.",
};

function flattenConfig(tree, prefix = "") {
  return Object.entries(tree).reduce((flat, [key, value]) => (
    value && typeof value === "object" && !Array.isArray(value)
      ? { ...flat, ...flattenConfig(value, `${prefix}${key}.`) }
      : { ...flat, [`${prefix}${key}`]: value }
  ), {});
}

function configText(value) {
  return Array.isArray(value) ? JSON.stringify(value) : String(value);
}

function renderConfig(state) {
  const editable = state !== null;
  const values = editable ? state.values : flattenConfig(data.config);
  const detector = new Set(editable ? state.detector_keys : []);
  document.getElementById("config-note").textContent = editable
    ? "Changes apply to every route on this page and re-run the report from the cached "
      + "detections; the detectors themselves do not run again. They last until the server "
      + "stops: restarting irap view returns to the values it was started with. Source: "
      + "default (configs/default.yaml), profile (--config), cli (--set), viewer (changed here)."
    : "Read-only: the values this route's report was built with. Serve a directory of "
      + "routes with irap view to change them here.";
  configApply.hidden = !editable;
  configError.textContent = "";
  let section = null;
  const rows = [];
  for (const [key, value] of Object.entries(values)) {
    const [head, ...rest] = key.split(".");
    if (head !== section) {
      section = head;
      rows.push(`<tr><th class="section" colspan="4">${head}</th></tr>`);
    }
    const text = attrEscape(configText(value));
    const source = editable ? state.sources[key] : "";
    const cell = editable && !detector.has(key)
      ? `<input data-key="${key}" value="${text}">`
      : text;
    const note = detector.has(key)
      ? "Read by the detector: re-run it to change this."
      : (CONFIG_NOTES[key] ?? "");
    rows.push(`<tr><td>${rest.join(".")}</td><td>${cell}</td>`
      + `<td class="${source}">${source}</td><td class="metrics">${note}</td></tr>`);
  }
  document.getElementById("config-table").innerHTML = rows.join("");
}

document.getElementById("config-open").addEventListener("click", () => {
  fetch("config")
    .then((response) => (response.ok ? response.json() : null))
    .catch(() => null)
    .then((state) => {
      renderConfig(state);
      configDialog.showModal();
    });
});
document.getElementById("config-close").addEventListener("click", () => configDialog.close());
document.getElementById("config-table").addEventListener("input", (event) => {
  event.target.classList.toggle("changed", event.target.value !== event.target.defaultValue);
});
configApply.addEventListener("click", () => {
  const changes = {};
  for (const input of configDialog.querySelectorAll("input.changed")) {
    changes[input.dataset.key] = input.value.trim();
  }
  if (!Object.keys(changes).length) {
    configError.textContent = "Nothing changed.";
    return;
  }
  configApply.disabled = true;
  fetch("config", {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify(changes),
  })
    .then((response) => response.json().then((body) => ({ ok: response.ok, body })))
    .then(({ ok, body }) => {
      if (!ok) {
        configApply.disabled = false;
        configError.textContent = body.error;
        return;
      }
      configDialog.close();
      showJob(body);
    })
    .catch((error) => {
      configApply.disabled = false;
      configError.textContent = `Could not apply: ${error.message}`;
    });
});

pollJob();

// routes.json exists only for a scanned directory of routes; a single-route
// export has no such file, and 404/network failure both read the same way
// here -- fall back to loading the page's own data.json directly.
fetch("routes.json")
  .then((response) => (response.ok ? response.json() : null))
  .then((routes) => {
    routeList = Array.isArray(routes) && routes.length ? routes : [];
    const stored = localStorage.getItem(ROUTE_KEY);
    const initial = routeList.length
      ? (routeList.find((route) => route.id === stored) || routeList[0]).id
      : null;
    setupResizeHandles();
    return loadRoute(initial);
  })
  .catch((error) => {
    document.getElementById("main-empty").textContent =
      "Could not load data.json - open this page through the local server "
      + "(irap view), not by double-clicking the file. " + error;
  });
</script>
</body>
</html>
