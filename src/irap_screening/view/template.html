<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>iRAP screening viewer</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<link rel="stylesheet" href="https://unpkg.com/uplot@1.6.31/dist/uPlot.min.css">
<style>
  /* Light is the default; [data-theme="dark"] mirrors every role. */
  :root {
    color-scheme: light;
    --bg: #f5f6f8;
    --panel: #ffffff;
    --subtle: #f9fafb;
    --line: #e5e7eb;
    --border2: #d6dae1;
    --border2-hover: #aab1bd;
    --text: #111827;
    --muted: #5f6673;
    --hover: #f3f4f6;
    --active-bg: #eef2ff;
    --accent: #2563eb;
    --accent-hover: #1d4ed8;
    --on-accent: #ffffff;
    --normal: #15803d;
    --normal-bg: #ecfdf3;
    --critical: #c81e1e;
    --critical-bg: #fef2f2;
    --unassessed: #6b7280;
    --unassessed-bg: #f3f4f6;
    --watch: #b45309;
    --watch-bg: #fffbeb;
    --gap: #6d28d9;
    --gap-bg: #f5f3ff;
    --gap-line: #ddd6fe;
    --map-bg: #e5e7eb;
    --frame-bg: #0b0c0e;
  }
  :root[data-theme="dark"] {
    color-scheme: dark;
    --bg: #0e0f12;
    --panel: #16181d;
    --subtle: #1a1d23;
    --line: #262a31;
    --border2: #353a43;
    --border2-hover: #555c68;
    --text: #e7e9ee;
    --muted: #8b93a1;
    --hover: #1d2026;
    --active-bg: #1b2440;
    --accent: #5b8cf7;
    --accent-hover: #7aa2f9;
    --on-accent: #0b0c0e;
    --normal: #4ade80;
    --normal-bg: #10291b;
    --critical: #f87171;
    --critical-bg: #2c1416;
    --unassessed: #9aa1ad;
    --unassessed-bg: #22252c;
    --watch: #fbbf24;
    --watch-bg: #2b2210;
    --gap: #a78bfa;
    --gap-bg: #221a38;
    --gap-line: #3b2f63;
    --map-bg: #1a1d23;
    --frame-bg: #000000;
  }
  * { box-sizing: border-box; scrollbar-color: var(--border2) transparent; }
  ::selection { background: var(--active-bg); color: var(--text); }
  input[type="checkbox"] { accent-color: var(--accent); }
  :is(button, select, input, textarea, summary):focus-visible {
    outline: 2px solid var(--accent); outline-offset: 2px;
  }
  body {
    /* Without overflow:hidden the window scrolls instead of the panels, which
       breaks scroll preservation when stepping frames. */
    margin: 0; height: 100vh; overflow: hidden; display: flex;
    background: var(--bg); color: var(--text);
    font: 14px/1.5 ui-sans-serif, system-ui, "Segoe UI", sans-serif;
  }
  #app { flex: 1; display: flex; min-width: 0; min-height: 0; }

  /* Sidebar */
  aside {
    width: 320px; flex: none; display: flex; flex-direction: column; min-width: 0;
    border-right: 1px solid var(--line); background: var(--panel);
  }
  header {
    padding: 16px; border-bottom: 1px solid var(--line);
    display: flex; align-items: flex-start; justify-content: space-between; gap: 8px;
  }
  #title-block { min-width: 0; flex: 1; }
  h1 { margin: 0 0 2px; font-size: 15px; font-weight: 600; overflow-wrap: anywhere; }
  .sub { color: var(--muted); font-size: 12px; }
  #theme-toggle { flex: none; padding: 6px; display: flex; }
  #route-select { display: none; margin-top: 10px; width: 100%; }
  #actions { margin-top: 10px; display: flex; gap: 6px; flex-wrap: wrap; }
  #job-status { margin-top: 4px; overflow-wrap: anywhere; }
  #coverage {
    padding: 10px 16px; border-bottom: 1px solid var(--line); font-size: 12px;
    display: grid; gap: 2px;
  }
  #coverage div { display: flex; justify-content: space-between; gap: 8px; text-transform: capitalize; }
  #coverage span { color: var(--muted); text-transform: none; font-variant-numeric: tabular-nums; }

  /* Filters: one bar in the sidebar, a panel that drops over the list. */
  #filter-bar { position: relative; padding: 10px 16px; border-bottom: 1px solid var(--line); }
  #filter-row { display: flex; align-items: center; gap: 8px; }
  #filter-toggle { display: inline-flex; align-items: center; gap: 6px; }
  #filter-toggle[aria-expanded="true"] { background: var(--hover); border-color: var(--border2-hover); }
  #filter-toggle .badge {
    min-width: 18px; padding: 0 5px; border-radius: 999px; font-size: 11px; line-height: 18px;
    text-align: center; background: var(--accent); color: var(--on-accent);
    font-variant-numeric: tabular-nums;
  }
  #filter-toggle .badge:empty { display: none; }
  #filter-status { color: var(--muted); font-size: 12px; margin-left: auto; font-variant-numeric: tabular-nums; }
  #filter-tokens { display: flex; flex-wrap: wrap; gap: 4px; }
  #filter-tokens:not(:empty) { margin-top: 8px; }
  .token {
    display: inline-flex; align-items: center; gap: 2px; max-width: 100%;
    padding: 1px 2px 1px 8px; border-radius: 6px; font-size: 12px;
    background: var(--active-bg); color: var(--accent);
  }
  .token b { font-weight: 500; }
  .token span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .token button { padding: 0 5px; border: 0; background: none; color: inherit; line-height: 18px; }
  .token button:hover { background: none; color: var(--accent-hover); }
  #filter-clear { padding: 1px 6px; border: 0; background: none; color: var(--muted); font-size: 12px; }
  #filter-clear:hover { background: none; color: var(--text); }
  #filter-panel {
    position: absolute; top: calc(100% - 4px); left: 8px; right: 8px; z-index: 1100;
    max-height: min(580px, 72vh); overflow-y: auto; padding: 4px 14px 14px;
    background: var(--panel); border: 1px solid var(--line); border-radius: 12px;
    box-shadow: 0 16px 40px rgba(15, 23, 42, .16), 0 2px 6px rgba(15, 23, 42, .08);
  }
  #filter-panel[hidden] { display: none; }
  .facet { padding-top: 12px; }
  .facet h3 {
    margin: 0 0 6px; font-size: 12px; font-weight: 600; color: var(--text);
    display: flex; justify-content: space-between; align-items: baseline;
  }
  .facet h3 small { font-weight: 400; font-size: 11px; color: var(--accent); }
  .facet-options { display: flex; flex-wrap: wrap; gap: 4px; }
  .pill {
    display: inline-flex; align-items: center; gap: 6px; padding: 3px 10px;
    border-radius: 999px; font-size: 12px; line-height: 18px; white-space: nowrap;
    background: var(--panel); border: 1px solid var(--line); color: var(--text);
  }
  .pill:hover { border-color: var(--border2-hover); background: var(--hover); }
  .pill .code { color: var(--muted); font-variant-numeric: tabular-nums; }
  .pill .n { color: var(--muted); font-size: 11px; font-variant-numeric: tabular-nums; }
  .pill.zero:not([aria-pressed="true"]) { opacity: .45; }
  .pill[aria-pressed="true"] { background: var(--accent); border-color: var(--accent); color: var(--on-accent); }
  .pill[aria-pressed="true"] .code, .pill[aria-pressed="true"] .n { color: inherit; opacity: .75; }
  .pill.critical[aria-pressed="true"] { background: var(--critical); border-color: var(--critical); color: var(--panel); }
  .pill.gap[aria-pressed="true"] { background: var(--gap); border-color: var(--gap); color: var(--panel); }

  /* Segment list */
  #segments { flex: 1; overflow-y: auto; padding: 6px 8px 12px; }
  .seg {
    padding: 7px 10px; border-radius: 8px; cursor: pointer;
    display: flex; align-items: center; gap: 10px; font-size: 13px;
  }
  .seg:hover { background: var(--hover); }
  .seg.active { background: var(--active-bg); }
  .seg.active .id { color: var(--accent); font-weight: 600; }
  .seg .id { font-variant-numeric: tabular-nums; }
  .seg .range { color: var(--muted); font-size: 12px; margin-left: auto; font-variant-numeric: tabular-nums; }
  .dot { width: 8px; height: 8px; border-radius: 50%; flex: none; }
  .dot.normal { background: var(--normal); }
  .dot.watch { background: var(--watch); }
  .dot.critical { background: var(--critical); }
  .dot.not_assessed { background: var(--unassessed); }
  .tag {
    font-size: 11px; line-height: 16px; padding: 0 6px; border-radius: 999px;
    background: var(--unassessed-bg); color: var(--muted); white-space: nowrap;
  }
  .tag.gap { background: var(--gap-bg); color: var(--gap); }

  /* Main: evidence on the left (frame, map, signs), judgement on the right
     (coding, recommendations), so a frame and its coding share one screen. */
  main {
    flex: 1; min-width: 0; overflow-y: auto; padding: 20px 24px 32px;
    display: grid; gap: 16px; align-content: start;
    grid-template-columns: minmax(0, 1.3fr) minmax(400px, 1fr);
    grid-template-areas: "head head" "left right";
  }
  /* Each column stacks on its own, so a tall coding list never stretches the frame card. */
  .col { display: flex; flex-direction: column; gap: 16px; min-width: 0; }
  .col-left { grid-area: left; }
  .col-right { grid-area: right; }
  @media (max-width: 1180px) {
    main { grid-template-columns: minmax(0, 1fr); grid-template-areas: none; }
    .col { display: contents; }
    .card.evidence { order: 1; } .card.coding { order: 2; } #map-card { order: 3; }
    .card.signs { order: 4; } .card.recs { order: 5; }
  }
  #detail { display: contents; }
  .seg-head { grid-area: head; display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }
  h2.seg-title { margin: 0; font-size: 20px; font-weight: 600; letter-spacing: -.01em; font-variant-numeric: tabular-nums; }
  .seg-range { color: var(--muted); font-size: 13px; font-variant-numeric: tabular-nums; }
  .seg-pos { margin-left: auto; color: var(--muted); font-size: 12px; font-variant-numeric: tabular-nums; }
  .empty { grid-area: head; color: var(--muted); padding: 40px 0; text-align: center; }
  .card {
    background: var(--panel); border: 1px solid var(--line); border-radius: 12px;
    min-width: 0; display: flex; flex-direction: column;
  }
  .card > * { flex-shrink: 0; }
  #map-card { height: 300px; overflow: hidden; }
  .card-head {
    display: flex; align-items: center; gap: 8px; padding: 12px 16px;
    border-bottom: 1px solid var(--line);
  }
  .card-head h2 { margin: 0; font-size: 13px; font-weight: 600; }
  .card-head .sub { margin-left: auto; }
  .card-body { padding: 14px 16px; }
  #map { flex: 1; min-height: 0; background: var(--map-bg); border-radius: 0 0 11px 11px; }

  /* Evidence */
  figure { margin: 0; }
  .frame-wrap { position: relative; overflow: hidden; border-radius: 8px; background: var(--frame-bg); }
  .frame-wrap img { width: 100%; display: block; }
  .frame-wrap .overlay { position: absolute; inset: 0; width: 100%; height: 100%; pointer-events: none; }
  .frame-wrap .overlay.hidden { display: none; }
  figcaption {
    display: flex; align-items: center; flex-wrap: wrap; gap: 6px 12px;
    margin-top: 10px; color: var(--muted); font-size: 12px;
  }
  figcaption > span, figcaption label { white-space: nowrap; }
  figcaption label { display: flex; align-items: center; gap: 4px; cursor: pointer; }
  figcaption .key-hint { margin-left: auto; }

  /* Controls */
  button {
    background: var(--panel); color: var(--text); border: 1px solid var(--border2);
    border-radius: 6px; padding: 5px 11px; cursor: pointer; font: inherit; font-size: 13px;
    line-height: 18px;
  }
  button:hover { background: var(--hover); }
  button.primary { background: var(--accent); border-color: var(--accent); color: var(--on-accent); font-weight: 500; }
  button.primary:hover { background: var(--accent-hover); border-color: var(--accent-hover); }
  button:disabled { opacity: .45; cursor: default; }
  select, input[type="text"], textarea {
    background: var(--panel); color: var(--text); border: 1px solid var(--border2);
    border-radius: 6px; padding: 5px 8px; font: inherit; font-size: 13px;
  }
  code { background: var(--hover); padding: 1px 6px; border-radius: 4px; font-size: 12px; }

  /* Tables */
  table { border-collapse: collapse; width: 100%; }
  th, td { text-align: left; padding: 10px 16px; border-bottom: 1px solid var(--line); vertical-align: middle; }
  tr:last-child > td { border-bottom: 0; }
  th { color: var(--muted); font-weight: 500; font-size: 12px; white-space: nowrap; background: var(--subtle); }
  .card-body table th, .card-body table td { padding: 8px 10px; }
  .metrics { color: var(--muted); font-size: 12px; font-variant-numeric: tabular-nums; }
  .badge {
    display: inline-block; padding: 1px 8px; border-radius: 999px; font-size: 12px; font-weight: 500;
    line-height: 20px; white-space: nowrap;
  }
  /* Sentence case for stored lower-case values: "Not assessed", "Quality of curve". */
  .badge::first-letter, .code-name::first-letter { text-transform: uppercase; }
  /* Fixed columns so name, code and flag line up across every row. */
  .code-row {
    display: grid; grid-template-columns: 120px minmax(0, 1fr) auto; align-items: center;
    gap: 6px 10px; padding: 12px 16px; border-bottom: 1px solid var(--line);
  }
  .code-row:last-child { border-bottom: 0; }
  .code-name { font-weight: 600; }
  .code-sub, .code-row .review { grid-column: 2 / -1; }
  .code-foot { display: flex; align-items: center; flex-wrap: wrap; gap: 6px; }
  .code-foot .review-status { margin-right: auto; display: inline-flex; align-items: center; flex-wrap: wrap; gap: 6px; font-size: 12px; }
  .code-foot button { font-size: 12px; padding: 3px 10px; }
  .confirmed { color: var(--normal); font-weight: 500; }
  /* The iRAP code is what a reviewer checks: number in a chip, label in full ink. */
  .irap-code { display: inline-flex; align-items: center; gap: 6px; font-size: 13px; font-weight: 500; }
  .irap-code .num {
    min-width: 22px; height: 22px; display: inline-grid; place-items: center; border-radius: 6px;
    border: 1px solid var(--border2); background: var(--subtle); font-weight: 600; font-variant-numeric: tabular-nums;
  }
  .irap-code.small { font-size: 12px; font-weight: 400; }
  .irap-code.small .num { min-width: 18px; height: 18px; border-radius: 4px; }
  .irap-code.none { color: var(--muted); font-weight: 400; }
  .badge.normal { background: var(--normal-bg); color: var(--normal); }
  .badge.critical { background: var(--critical-bg); color: var(--critical); }
  .badge.watch { background: var(--watch-bg); color: var(--watch); }
  .badge.not_assessed { background: var(--unassessed-bg); color: var(--unassessed); }
  .review { display: grid; grid-template-columns: 180px minmax(0, 1fr) auto auto; gap: 6px; align-items: center; }
  .review[hidden] { display: none; }
  .review select, .review input[type="text"] { font-size: 12px; padding: 4px 8px; min-width: 0; }
  .review button { font-size: 12px; padding: 4px 10px; }
  .review-status { color: var(--muted); font-size: 11px; }
  .details-open { padding: 3px 10px; font-size: 12px; white-space: nowrap; }

  /* Recommendations */
  .rec {
    border: 1px solid var(--line); background: var(--subtle); border-radius: 8px;
    padding: 12px 14px; margin-bottom: 10px;
  }
  .rec .rule { font-weight: 600; font-size: 13px; }
  .rec .text { margin-top: 4px; line-height: 1.55; font-size: 13px; }
  .rec.reviewed { border-color: var(--gap-line); background: var(--gap-bg); }
  .rec.reviewed .rule { color: var(--gap); }
  .rec.reviewed .text { white-space: pre-wrap; }
  .rec-generated { margin: 0 0 10px; color: var(--muted); font-size: 12px; }
  .rec-edit summary { cursor: pointer; color: var(--accent); font-size: 13px; }
  .rec-edit textarea { display: block; width: 100%; min-height: 96px; margin: 8px 0; line-height: 1.5; }
  h2 { font-size: 13px; font-weight: 600; margin: 0; }

  /* Dialogs */
  #details, #config {
    width: min(1200px, 94vw); max-height: 92vh; padding: 0;
    border: 1px solid var(--line); border-radius: 12px;
    background: var(--panel); color: var(--text);
    box-shadow: 0 24px 60px rgba(15, 23, 42, .25);
  }
  #config { width: min(860px, 94vw); }
  #details::backdrop, #config::backdrop { background: rgb(15 23 42 / .45); }
  #details > header, #config > header {
    position: sticky; top: 0; z-index: 2; background: var(--panel);
    padding: 12px 16px; border-bottom: 1px solid var(--line); gap: 6px; align-items: center;
  }
  #details h2, #config h2 { margin: 0 auto 0 0; font-size: 15px; font-weight: 600; }
  #details .body, #config .body { padding: 8px 16px 16px; }
  #config-note { max-width: 780px; }
  #config-error { color: var(--critical); white-space: pre-wrap; font-size: 12px; }
  #config-table { font-size: 12px; font-variant-numeric: tabular-nums; }
  #config-table td, #config-table th { padding: 5px 10px; }
  #config-table th.section { color: var(--text); font-size: 13px; padding-top: 14px; background: none; }
  #config-table input { width: 160px; font-size: 12px; padding: 3px 6px; }
  #config-table input.changed { border-color: var(--watch); }
  #config-table .viewer { color: var(--watch); }
  #details .chart-title { color: var(--muted); font-size: 12px; margin: 14px 0 0; }
  /* uPlot's legend marker is an empty square outlined in the series colour,
     which reads as an unticked checkbox. Draw it as a line sample instead
     (dashed for a dashed series); clicking an entry still hides the series. */
  #details .u-legend .u-marker {
    width: 18px; height: 0; border-width: 2px 0 0 0 !important;
    background: none !important; vertical-align: middle;
  }
  #details-summary p { margin: 6px 0; max-width: 900px; }
  #details-summary .calc { color: var(--muted); font-size: 12px; font-variant-numeric: tabular-nums; }
  #details-summary .critical { color: var(--critical); }
  #details-summary .normal { color: var(--normal); }
  #details-samples { margin-top: 14px; }
  #details-samples summary { cursor: pointer; color: var(--muted); font-size: 12px; }
  #details-samples table { font-size: 12px; font-variant-numeric: tabular-nums; margin-top: 6px; }
  #details-samples td, #details-samples th { padding: 3px 10px; }
  #details-samples tr.gated td { color: var(--unassessed); }
  #details-samples tr.deciding td { color: var(--critical); font-weight: 600; }
  #details-samples tr.window td { background: var(--active-bg); }
</style>
</head>
<body>
<div id="app">
<aside>
  <header>
    <div id="title-block">
      <h1 id="route">Loading…</h1>
      <div class="sub" id="generated"></div>
      <select id="route-select" title="Switch route"></select>
      <div id="actions">
        <button id="config-open">Thresholds</button>
        <span id="upload" hidden>
          <button id="upload-button">Upload route</button>
          <input id="upload-file" type="file" accept=".zip" hidden>
        </span>
      </div>
      <div class="sub" id="job-status"></div>
    </div>
    <button id="theme-toggle" title="Toggle light/dark theme" aria-label="Toggle light/dark theme">
      <svg id="theme-icon" viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor"
           stroke-width="2" stroke-linecap="round" stroke-linejoin="round"></svg>
    </button>
  </header>
  <div id="coverage"></div>
  <div id="filter-bar">
    <div id="filter-row">
      <button id="filter-toggle" aria-expanded="false" aria-controls="filter-panel">
        <svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor"
             stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <polygon points="22 3 2 3 10 12.46 10 19 14 21 14 12.46 22 3"></polygon>
        </svg>
        Filters <span class="badge"></span>
      </button>
      <span id="filter-status"></span>
    </div>
    <div id="filter-tokens"></div>
    <div id="filter-panel" hidden></div>
  </div>
  <div id="segments"></div>
</aside>
<main>
  <div id="detail"><div class="empty" id="main-empty">Select a segment.</div></div>
  <section id="map-card" class="card">
    <div class="card-head"><h2>Route map</h2><span class="sub">Click a segment to open it &middot; dots: its photos, blue = shown (position from timestamp)</span></div>
    <div id="map"></div>
  </section>
</main>
</div>
<dialog id="details">
  <header>
    <h2 id="details-title"></h2>
    <button id="details-prev" title="Previous segment">&larr;</button>
    <button id="details-next" title="Next segment">&rarr;</button>
    <button id="details-close" aria-label="Close">&times;</button>
  </header>
  <div class="body">
    <div id="details-summary"></div>
    <p class="chart-title" id="details-overview-caption"></p>
    <div id="details-overview"></div>
    <p class="chart-title">This segment, with 30 m either side. Red line: the sample that set the flag.</p>
    <div id="chart-a"></div>
    <div id="chart-b"></div>
    <div id="chart-c"></div>
    <details id="details-samples"></details>
  </div>
</dialog>

<dialog id="config">
  <header>
    <h2>Thresholds</h2>
    <button id="config-apply" hidden>Apply and re-run</button>
    <button id="config-close" aria-label="Close">&times;</button>
  </header>
  <div class="body">
    <p class="sub" id="config-note"></p>
    <div id="config-error"></div>
    <table id="config-table"></table>
  </div>
</dialog>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="https://unpkg.com/uplot@1.6.31/dist/uPlot.iife.min.js"></script>
<script>
const MODULES = ["curvature", "grade", "delineation", "condition"];
const FLAG_COLOR = {
  normal: "#16a34a", watch: "#d97706",
  critical: "#dc2626", not_assessed: "#9ca3af",
};

const THEME_KEY = "irap-view-theme";
// Feather-style sun/moon icons: the icon shown is what clicking it switches
// *to*, so a moon shows while light and a sun shows while dark.
const THEME_ICON = {
  dark: `<circle cx="12" cy="12" r="4"></circle>
    <line x1="12" y1="2" x2="12" y2="4"></line><line x1="12" y1="20" x2="12" y2="22"></line>
    <line x1="4.22" y1="4.22" x2="5.64" y2="5.64"></line>
    <line x1="18.36" y1="18.36" x2="19.78" y2="19.78"></line>
    <line x1="2" y1="12" x2="4" y2="12"></line><line x1="20" y1="12" x2="22" y2="12"></line>
    <line x1="4.22" y1="19.78" x2="5.64" y2="18.36"></line>
    <line x1="18.36" y1="5.64" x2="19.78" y2="4.22"></line>`,
  light: `<path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path>`,
};

function applyTheme(theme) {
  document.documentElement.dataset.theme = theme;
  document.getElementById("theme-icon").innerHTML = THEME_ICON[theme];
  localStorage.setItem(THEME_KEY, theme);
}

function setupThemeToggle() {
  const stored = localStorage.getItem(THEME_KEY);
  const preferred = stored
    || "light";
  applyTheme(preferred);
  document.getElementById("theme-toggle").addEventListener("click", () => {
    applyTheme(document.documentElement.dataset.theme === "dark" ? "light" : "dark");
  });
}
setupThemeToggle();

const OVERLAY_KEY = "irap-view-overlay";
let overlayVisible = localStorage.getItem(OVERLAY_KEY) !== "hidden";

let data = null;
let selected = null;
let frameIndex = 0;
let map = null;
let layers = {};
let boundaries = [];
let selectionCasing = null;
let frameDots = null;
let laneByFrame = new Map();
let signByFrame = new Map();
let routeList = [];
let currentRoute = null;

// Frame images and detection files live under the route's own directory,
// which a multi-route export scopes behind a /<route_id>/ URL segment (see
// serve.py's _resolve_multi_path). A single-route export has no such
// segment, so the prefix is empty and paths resolve exactly as before.
function routePrefix() {
  return currentRoute ? `${currentRoute}/` : "";
}

// Every attribute with a flag. Quality of curve is derived rather than scored,
// but a Poor curve is critical, so it colours the segment too.
const FLAGGED = [...MODULES, "quality_of_curve"];

// The flag the page acts on: the reviewer's where one was saved, else the
// pipeline's. report.json only ever holds the pipeline's.
function shownFlag(segment, module) {
  const review = segment.review && segment.review[module];
  if (review) return review.flag;
  return (segment[module] && segment[module].flag) ?? "not_assessed";
}

function segmentReviewed(segment) {
  return FLAGGED.some((module) => segment.review && segment.review[module]);
}

// The worst flag across the attributes is what the list dot shows: a segment is
// as bad as its worst attribute, which is how iRAP aggregates within a unit.
const SEVERITY = ["not_assessed", "normal", "watch", "critical"];
function worstFlag(segment) {
  let worst = "not_assessed";
  for (const module of FLAGGED) {
    const flag = shownFlag(segment, module);
    if (SEVERITY.indexOf(flag) > SEVERITY.indexOf(worst)) worst = flag;
  }
  return worst;
}

// The list dot only shows the worst flag; this fills in which module(s) it
// came from as a hover tooltip -- plain text, so it scales to however many
// modules the pipeline grows to without adding more indicators to the row.
function flagSummary(segment) {
  return FLAGGED.map((module) =>
    `${module.replace(/_/g, " ")}: ${flagText(shownFlag(segment, module))}`).join(" · ");
}

// Display text only: the stored flag, and the CSS class built from it, stay
// "not_assessed".
function flagText(flag) {
  return flag ? flag.replace("_", " ") : "-";
}

// Display only: each stored metric gets a label and the unit a reader
// expects. A key not listed here still shows, with its underscores dropped.
const DEG_PER_RAD = 180 / Math.PI;
const METRIC_TEXT = {
  radius_m: (v) => `Curve radius ${Math.round(v)} m`,
  gps_radius_m: (v) => `GPS cross-check ${Math.round(v)} m`,
  gps_grade_pct: (v) => `GPS altitude cross-check ${v.toFixed(1)}%`,
  yaw_rate_rad_s: (v) => `Turn rate ${(v * DEG_PER_RAD).toFixed(1)}°/s`,
  mean_speed_mps: (v) => `Mean speed ${Math.round(v * 3.6)} km/h`,
  gyro_bias_rad_s: (v) => `Gyro bias ${(v * DEG_PER_RAD).toFixed(2)}°/s`,
  grade_pct: (v) => `Grade ${v.toFixed(1)}%`,
  pitch_deg: (v) => `Pitch ${v.toFixed(1)}°`,
  // The segment's minimum across its frames (lane.py), hence "lowest".
  weber_contrast: (v) => `Lowest marking contrast ${v.toFixed(2)} (Weber)`,
};
// Shown elsewhere (iRAP category column) or folded into one phrase below.
const UNLISTED_METRICS = new Set(
  ["irap_category", "detection_rate", "detected_frames", "total_frames",
   "lines_visible", "lines_total", "needs_review"]);

function metricsOf(entry) {
  const parts = Object.entries(entry)
    .filter(([key, value]) => typeof value === "number" && !UNLISTED_METRICS.has(key))
    .map(([key, value]) => METRIC_TEXT[key]
      ? METRIC_TEXT[key](value)
      : `${key.replace(/_/g, " ")} ${Number(value.toFixed(3))}`);
  if (entry.lines_total != null) {
    parts.unshift(`${entry.lines_visible} of ${entry.lines_total} lines visible`);
  }
  // Curvature (gyro vs GPS bearing) and grade (accelerometer vs GPS altitude):
  // the IMU decided the flag, the GPS read the other side of the threshold.
  if (entry.needs_review) parts.unshift("Needs review: GPS cross-check disagrees");
  if (entry.total_frames != null) {
    parts.push(`Lanes detected in ${entry.detected_frames} of ${entry.total_frames} frames`
             + ` (${Math.round(entry.detection_rate * 100)}%)`);
  }
  return parts.join(" · ");
}

// iRAP's own descriptive band tables (Coding Manual). Display only -- these
// labels are read straight off entry.irap_category, which the Python layer
// already computed and tested; this is string formatting, not re-derivation.
const IRAP_CURVATURE_LABELS = {
  1: "1 - straight/gently curving (>800 m)",
  2: "2 - moderate (400-800 m)",
  3: "3 - sharp (200-400 m)",
  4: "4 - very sharp (<200 m)",
};
const IRAP_GRADE_LABELS = {
  1: "1 - flat/gentle (<7.5%)",
  4: "4 - moderate (7.5-<10%)",
  5: "5 - steep (>=10%)",
};
// Delineation has no independent numeric scale like curvature/grade's radius
// or percentage bands -- its code mirrors the flag one-for-one (see
// irap_delineation_category in lane.py). "lane marking:" qualifies it down
// to the part actually measured: following AiRAP, it is determined from road
// lines/markings/lanes; hazard warning signs are not assessed.
const IRAP_DELINEATION_LABELS = {
  1: "1 - lane marking: adequate",
  2: "2 - lane marking: poor",
};
// Only a reviewer codes condition; the module itself is not built yet.
const IRAP_CONDITION_LABELS = { 1: "1 - good", 2: "2 - medium", 3: "3 - poor" };

// generated_at is stored in UTC (report.py's own source of truth); the
// sidebar shows it in Malaysia time (UTC+8, no DST) since that is where this
// project is run and read.
function formatGeneratedAt(iso) {
  const date = new Date(iso);
  if (Number.isNaN(date.getTime())) return iso;
  const parts = new Intl.DateTimeFormat("en-GB", {
    timeZone: "Asia/Kuala_Lumpur",
    year: "numeric", month: "2-digit", day: "2-digit",
    hour: "2-digit", minute: "2-digit", second: "2-digit", hour12: false,
  }).formatToParts(date).reduce((acc, part) => ({ ...acc, [part.type]: part.value }), {});
  return `${parts.year}-${parts.month}-${parts.day} ${parts.hour}:${parts.minute}:${parts.second} UTC+8`;
}


function segmentHasGap(segment) {
  return Boolean((segment.recommendations && segment.recommendations.length)
    || (segment.review && segment.review.recommendation));
}

// The category the page shows: the reviewer's where one was saved, else the
// pipeline's. null where there is none (not assessed, or condition, which the
// pipeline does not code).
function shownCategory(segment, module) {
  const review = segment.review && segment.review[module];
  if (review) return review.category ?? null;
  if (module === "quality_of_curve") {
    return (segment.quality_of_curve && segment.quality_of_curve.code) ?? null;
  }
  const entry = segment[module];
  return entry && entry.flag !== "not_assessed" && entry.irap_category != null
    ? Number(entry.irap_category) : null;
}

function codeKey(category) {
  return category == null ? "na" : String(category);
}

// Faceted filtering. Options within a facet are ORed (Sharp or Very sharp);
// facets are ANDed with each other (Sharp curvature and a Poor curve).
// Attribute facets read the shown category, so a reviewer's code counts.
const STATUS_OPTIONS = {
  critical: { label: "Critical", test: (s) => worstFlag(s) === "critical" },
  gap: { label: "Gap", test: segmentHasGap },
  // The GPS cross-checks: curvature (gyro vs GPS bearing) and grade
  // (accelerometer vs GPS altitude). The IMU still decides each flag.
  gps_disagrees: {
    label: "GPS disagrees",
    title: "Needs review: GPS bearing (curvature) or GPS altitude (grade) disagrees on the flag",
    test: (s) => s.curvature?.needs_review === 1 || s.grade?.needs_review === 1,
  },
  uncovered: { label: "Not assessed", test: (s) => s.coverage === "uncovered" },
  reviewed: { label: "Reviewed", test: segmentReviewed },
  unreviewed: { label: "Not reviewed", test: (s) => !segmentReviewed(s) },
};
// Pill text; the iRAP band (REVIEW_LABELS) is the tooltip.
const FACET_NAMES = {
  curvature: { 1: "Straight", 2: "Moderate", 3: "Sharp", 4: "Very sharp" },
  grade: { 1: "Flat", 4: "Moderate", 5: "Steep" },
  delineation: { 1: "Adequate", 2: "Poor" },
  condition: { 1: "Good", 2: "Medium", 3: "Poor" },
  quality_of_curve: { 1: "Adequate", 2: "Poor", 3: "Not applicable" },
};
const FACETS = ["status", ...FLAGGED];
const facetSelection = Object.fromEntries(FACETS.map((facet) => [facet, new Set()]));

function facetTitle(facet) {
  return facet === "status" ? "Status" : facet[0].toUpperCase() + facet.slice(1).replace(/_/g, " ");
}

function facetOptions(facet) {
  if (facet === "status") {
    return Object.entries(STATUS_OPTIONS)
      .map(([key, option]) => ({ key, label: option.label, title: option.title }));
  }
  return [
    ...Object.entries(FACET_NAMES[facet]).map(([code, label]) =>
      ({ key: code, code, label, title: REVIEW_LABELS[facet][code] })),
    { key: "na", label: "Not assessed" },
  ];
}

function optionMatches(segment, facet, key) {
  return facet === "status"
    ? STATUS_OPTIONS[key].test(segment)
    : codeKey(shownCategory(segment, facet)) === key;
}

function facetMatches(segment, facet) {
  const chosen = facetSelection[facet];
  return chosen.size === 0 || [...chosen].some((key) => optionMatches(segment, facet, key));
}

function segmentMatchesFilters(segment, except = null) {
  return FACETS.every((facet) => facet === except || facetMatches(segment, facet));
}

function filtering() {
  return FACETS.some((facet) => facetSelection[facet].size > 0);
}

// An option's count is what ticking it would show given the other facets --
// its own facet is left out, as options within it are ORed anyway.
function renderFilterPanel() {
  document.getElementById("filter-panel").innerHTML = FACETS.map((facet) => {
    const pool = data.segments.filter((segment) => segmentMatchesFilters(segment, facet));
    const chosen = facetSelection[facet];
    return `<section class="facet"><h3>${facetTitle(facet)}`
      + (chosen.size ? `<small>${chosen.size} selected</small>` : "") + `</h3>`
      + `<div class="facet-options">`
      + facetOptions(facet).map((option) => {
        const n = pool.filter((segment) => optionMatches(segment, facet, option.key)).length;
        const pressed = chosen.has(option.key);
        const tone = facet === "status" && ["critical", "gap"].includes(option.key) ? ` ${option.key}` : "";
        return `<button class="pill${tone}${n ? "" : " zero"}" aria-pressed="${pressed}" `
          + `data-facet="${facet}" data-key="${option.key}"`
          + (option.title ? ` title="${attrEscape(option.title)}"` : "") + `>`
          + (option.code ? `<span class="code">${option.code}</span>` : "")
          + `${option.label}<span class="n">${n}</span></button>`;
      }).join("")
      + `</div></section>`;
  }).join("");
}

function renderFilterTokens() {
  const active = FACETS.filter((facet) => facetSelection[facet].size);
  const names = (facet) => facetOptions(facet)
    .filter((option) => facetSelection[facet].has(option.key)).map((option) => option.label);
  document.getElementById("filter-tokens").innerHTML = active.map((facet) =>
    `<span class="token" title="${attrEscape(names(facet).join(" or "))}">`
    + `<span><b>${facetTitle(facet)}:</b> ${names(facet).join(", ")}</span>`
    + `<button data-facet="${facet}" aria-label="Remove ${facetTitle(facet)} filter">&times;</button></span>`
  ).join("") + (active.length ? `<button id="filter-clear">Clear all</button>` : "");
  document.querySelector("#filter-toggle .badge").textContent = active.length || "";
}

function applyFilters() {
  renderFilterTokens();
  if (!document.getElementById("filter-panel").hidden) renderFilterPanel();
  renderSegmentList();
}

function setFilterPanel(open) {
  const panel = document.getElementById("filter-panel");
  panel.hidden = !open;
  document.getElementById("filter-toggle").setAttribute("aria-expanded", String(open));
  if (open) renderFilterPanel();
}

document.getElementById("filter-toggle").addEventListener("click", () => {
  setFilterPanel(document.getElementById("filter-panel").hidden);
});

document.getElementById("filter-panel").addEventListener("click", (event) => {
  const pill = event.target.closest(".pill");
  if (!pill) return;
  const chosen = facetSelection[pill.dataset.facet];
  if (chosen.has(pill.dataset.key)) chosen.delete(pill.dataset.key); else chosen.add(pill.dataset.key);
  applyFilters();
  // The panel was redrawn; keep keyboard focus on the same pill.
  document.querySelector(
    `.pill[data-facet="${pill.dataset.facet}"][data-key="${pill.dataset.key}"]`)?.focus();
});

document.getElementById("filter-tokens").addEventListener("click", (event) => {
  const button = event.target.closest("button");
  if (!button) return;
  if (button.id === "filter-clear") FACETS.forEach((facet) => facetSelection[facet].clear());
  else facetSelection[button.dataset.facet].clear();
  applyFilters();
});

// Closes on Escape or a click anywhere outside the filter bar.
document.addEventListener("keydown", (event) => {
  if (event.key !== "Escape" || document.getElementById("filter-panel").hidden) return;
  setFilterPanel(false);
  document.getElementById("filter-toggle").focus();
});
document.addEventListener("click", (event) => {
  if (!event.target.closest("#filter-bar") && event.target.isConnected) setFilterPanel(false);
});

function renderSegmentList() {
  document.getElementById("segments").innerHTML = data.segments.map((segment, i) => {
    if (!segmentMatchesFilters(segment)) return "";
    const flag = worstFlag(segment);
    const start = Math.round(segment.start_m), end = Math.round(segment.end_m);
    const hasGap = segmentHasGap(segment);
    return `<div class="seg${hasGap ? " has-gap" : ""}${i === selected ? " active" : ""}" `
         + `data-i="${i}" title="${flagSummary(segment)}">`
         + `<span class="dot ${flag}"></span>`
         + `<span class="id">${segment.segment_id}</span>`
         + (hasGap ? `<span class="tag gap">Gap</span>` : "")
         + (segmentReviewed(segment) ? `<span class="tag">Reviewed</span>` : "")
         + `<span class="range">${start}-${end} m</span></div>`;
  }).join("");

  document.querySelectorAll(".seg").forEach((node) => {
    node.addEventListener("click", () => select(Number(node.dataset.i)));
  });

  const status = document.getElementById("filter-status");
  if (!filtering()) {
    status.textContent = "";
  } else {
    const shown = data.segments.filter(segmentMatchesFilters).length;
    status.textContent = `${shown} of ${data.segments.length}`;
  }
}

function renderSidebar() {
  const listed = routeList.find((route) => route.id === currentRoute);
  document.getElementById("route").textContent =
    `Route ${listed ? listed.label : `${data.route_id}-${data.route_name}`}`;
  document.getElementById("generated").textContent =
    `${data.segments.length} segments · ${formatGeneratedAt(data.generated_at)}`;

  document.getElementById("coverage").innerHTML = MODULES.map((module) => {
    const cov = (data.coverage && data.coverage[module]) || {};
    const total = cov.total ?? 0;
    const missing = cov.not_assessed ?? 0;
    return `<div>${module} <span>${total - missing} of ${total} assessed`
         + (missing ? `, ${missing} not assessed` : "") + `</span></div>`;
  }).join("");

  renderSegmentList();
}

function renderMap() {
  // Switching routes calls this again on the same #map element; Leaflet
  // refuses to re-initialize a container it already owns, so the old
  // instance has to go first.
  if (map) {
    map.remove();
    map = null;
  }
  layers = {};
  boundaries = [];
  document.getElementById("map").style.display = "";

  // Older reports carry only the segment's ends.
  const pathOf = (s) => s.path_latlon ?? [s.start_latlon, s.end_latlon];
  const points = data.segments.flatMap(pathOf);
  if (!points.length || typeof L === "undefined") {
    // Leaflet comes from a CDN; with no network the map is simply absent and
    // everything else still works.
    document.getElementById("map").style.display = "none";
    return;
  }
  map = L.map("map", { attributionControl: false });
  L.tileLayer("https://tile.openstreetmap.org/{z}/{x}/{y}.png", { maxZoom: 19 })
    .addTo(map);
  // Small white dots at each segment boundary make the 100 m breakpoints
  // visible against the colored route line, which otherwise reads as one
  // continuous strip.
  const boundaryMarker = (latlon) => boundaries.push(L.circleMarker(latlon, {
    radius: 4, color: "#0f1114", weight: 1.5, fillColor: "#fff", fillOpacity: 1,
  }).addTo(map));
  data.segments.forEach((segment, i) => {
    const line = L.polyline(pathOf(segment), {
      color: FLAG_COLOR[worstFlag(segment)], weight: 5,
    }).addTo(map);
    line.bindTooltip(
      `${segment.segment_id} · ${Math.round(segment.start_m)}-${Math.round(segment.end_m)} m`,
      { sticky: true },
    );
    line.on("click", () => select(i));
    layers[i] = line;
    boundaryMarker(segment.start_latlon);
  });
  boundaryMarker(data.segments[data.segments.length - 1].end_latlon);
  selectionCasing = L.polyline([], { color: "#0f1114", weight: 11, interactive: false }).addTo(map);
  frameDots = L.layerGroup().addTo(map);
  map.fitBounds(L.latLngBounds(points).pad(0.2));
}

// The selected segment stands out by a dark casing and extra width. The rest stay
// opaque: a faded red over the map's yellow roads reads as orange, a flag colour
// that does not exist. Boundary dots stay on top to show where it ends.
function highlightSelected() {
  if (!selectionCasing || !layers[selected]) return;
  Object.entries(layers).forEach(([i, line]) => {
    line.setStyle({ weight: Number(i) === selected ? 7 : 5 });
  });
  selectionCasing.setLatLngs(layers[selected].getLatLngs()).bringToFront();
  layers[selected].bringToFront();
  boundaries.forEach((dot) => dot.bringToFront());
  drawFrameDots();
}

// The selected segment's photos, where the timestamp puts them on the GPS
// track (the same estimate as "at N m" under the frame). The one on screen is
// blue and larger; clicking a dot shows that photo.
function drawFrameDots() {
  if (!frameDots) return;
  frameDots.clearLayers();
  const segment = data.segments[selected];
  const positions = (segment && segment.frame_latlon) || [];
  positions.forEach((latlon, i) => {
    const current = i === frameIndex;
    const dot = L.circleMarker(latlon, {
      // Blue, unlike the white segment-boundary dots.
      radius: current ? 7 : 4,
      color: current ? "#fff" : "#2f81f7",
      weight: current ? 2 : 1.5,
      fillColor: current ? "#2f81f7" : "#cfe3ff",
      fillOpacity: 1,
    }).addTo(frameDots);
    dot.bindTooltip(`${segment.frame_ids[i]} · frame ${i + 1} of ${positions.length}`);
    dot.on("click", () => {
      frameIndex = i;
      showFrame();
    });
    if (current) dot.bringToFront();
  });
}

// Escapes a value for use inside an HTML attribute (the review note round-trips
// through value="..."); textContent-style escaping is not enough there.
function attrEscape(value) {
  return String(value).replace(/&/g, "&amp;").replace(/"/g, "&quot;");
}

// For reviewer-typed text placed as element content.
function textEscape(value) {
  return attrEscape(value).replace(/</g, "&lt;").replace(/>/g, "&gt;");
}

// A reviewer codes the iRAP category, or Not assessed; review.py derives the
// flag from it, so the category and the flag can never disagree.
function reviewCell(segment, module) {
  const review = (segment.review && segment.review[module]) || null;
  const chosen = review ? String(review.category ?? "na") : "";
  const option = (value, label) =>
    `<option value="${value}"${chosen === value ? " selected" : ""}>${label}</option>`;
  return `<div class="review" data-module="${module}" hidden>`
       + `<select class="review-category">`
       + option("", "iRAP category...")
       + Object.entries(REVIEW_LABELS[module]).map(([code, label]) => option(code, label)).join("")
       + option("na", "Not assessed")
       + `</select>`
       + `<input class="review-note" type="text" placeholder="note" `
       + `value="${attrEscape(review ? review.note : "")}">`
       + `<button class="review-save primary">Save</button>`
       + `<button class="review-open">Cancel</button>`
       + `</div>`;
}

function flagBadge(flag, extra = "") {
  return `<span class="badge ${flag}${extra}">${flagText(flag)}</span>`;
}

// "4 - very sharp (<200 m)" or "2 Poor" -> number chip plus label; anything
// without a leading code ("-", "not assessed") stays muted text.
function codeChip(label, extra = "") {
  const match = /^(\d+)\s*-?\s*(.*)$/.exec(label ?? "");
  if (!match) return `<span class="irap-code none${extra}">${label ?? "-"}</span>`;
  return `<span class="irap-code${extra}"><span class="num">${match[1]}</span>${match[2]}</span>`;
}

function moduleRows(segment) {
  return MODULES.map((module) => {
    const entry = segment[module] || {};
    const detail = entry.notes ? entry.notes : metricsOf(entry);
    return codeRow(segment, module, module, entry.irap_category ?? null, entry.flag, detail);
  }).join("") + qualityOfCurveRow(segment);
}

const QUALITY_OF_CURVE_LABELS = { 1: "1 Adequate", 2: "2 Poor", 3: "3 Not applicable" };
const REVIEW_LABELS = {
  curvature: IRAP_CURVATURE_LABELS,
  grade: IRAP_GRADE_LABELS,
  delineation: IRAP_DELINEATION_LABELS,
  condition: IRAP_CONDITION_LABELS,
  quality_of_curve: QUALITY_OF_CURVE_LABELS,
};

// Derived from curvature, delineation and signs rather than scored, but it
// carries a flag (Poor is critical) and takes a review like the modules.
// Older reports lack the field entirely.
function qualityOfCurveRow(segment) {
  const quality = segment.quality_of_curve;
  if (!quality) return "";
  return codeRow(segment, "quality_of_curve", "quality of curve",
    quality.code ?? null, quality.flag, quality.basis);
}

const MODULE_HINTS = {
  delineation: "Determined based on recognition of road lines/markings/lanes (AiRAP); hazard warning signs are not assessed.",
};

// One attribute: the reviewer's code and flag where saved, else the
// pipeline's. A review that kept the pipeline code reads "Confirmed"; one that
// changed it keeps the pipeline result on its status line. Confirm saves the
// pipeline code as is; Review / Edit opens the collapsed form.
function codeRow(segment, module, name, pipelineCode, pipelineFlag, detail) {
  const review = (segment.review && segment.review[module]) || null;
  const label = (code) => code == null ? "Not assessed" : (REVIEW_LABELS[module][code] ?? "-");
  const systemFlag = pipelineFlag ?? "not_assessed";
  let status = "";
  if (review) {
    const when = new Date(review.reviewed_at).toLocaleString();
    const note = review.note ? ` · ${textEscape(review.note)}` : "";
    status = review.category === pipelineCode
      ? `<span class="confirmed">✓ Confirmed</span><span>${when}${note}</span>`
      : `<span>Pipeline</span>${codeChip(label(pipelineCode), " small")}${flagBadge(systemFlag)}`
        + `<span>· Edited ${when}${note}</span>`;
  }
  const confirm = !review && pipelineCode != null
    ? `<button class="review-confirm" data-category="${pipelineCode}">Confirm</button>` : "";
  return `<div class="code-row" data-module="${module}">`
       + `<span class="code-name"${MODULE_HINTS[module] ? ` title="${MODULE_HINTS[module]}"` : ""}>${name}</span>`
       + codeChip(label(review ? review.category : pipelineCode))
       + flagBadge(review ? review.flag : systemFlag)
       + `<div class="code-sub metrics">${detail}</div>`
       + `<div class="code-sub code-foot"><span class="review-status">${status}</span>`
       + `${detailsButton(module)}${confirm}<button class="review-open">${review ? "Edit" : "Review"}</button></div>`
       + reviewCell(segment, module)
       + `</div>`;
}

// Delegated on document: renderDetail() replaces the whole panel on every
// save and every segment switch, so a handler bound to the button itself
// would need rebinding after each render anyway.
document.addEventListener("click", (event) => {
  const open = event.target.closest(".review-open");
  if (open) {
    const form = open.closest(".code-row").querySelector(".review");
    form.hidden = !form.hidden;
    if (!form.hidden) form.querySelector(".review-category").focus();
    return;
  }
  const confirm = event.target.closest(".review-confirm");
  if (confirm) {
    saveReview(confirm.closest(".code-row").dataset.module, Number(confirm.dataset.category), "", confirm);
    return;
  }
  const button = event.target.closest(".review-save");
  if (!button) return;
  const container = button.closest(".review");
  const choice = container.querySelector(".review-category").value;
  if (!choice) return;
  saveReview(container.dataset.module, choice === "na" ? null : Number(choice),
    container.querySelector(".review-note").value, button);
});

function saveReview(module, category, note, button) {
  const segment = data.segments[selected];
  button.disabled = true;
  fetch(`${routePrefix()}review`, {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ segment_id: segment.segment_id, module, category, note }),
  })
    .then((response) => {
      if (!response.ok) throw new Error(`save failed (${response.status})`);
      return response.json();
    })
    .then((entry) => {
      segment.review = segment.review || {};
      segment.review[module] = entry;
      // The reviewed flag recolours the list dot and the map line.
      renderSegmentList();
      if (layers[selected]) layers[selected].setStyle({ color: FLAG_COLOR[worstFlag(segment)] });
      renderDetail();
    })
    .catch((error) => {
      button.disabled = false;
      alert(`Could not save review: ${error.message}`);
    });
}

function doubleLineText(dl) {
  // The scan only runs on a critical-grade segment (gap-check's only use of
  // this value), so present=false is ambiguous without assessed: it means
  // either "scanned, none found" or "never scanned here".
  if (dl.assessed === false) return "not checked (grade not critical)";
  if (dl.present) return `present (confidence ${dl.confidence.toFixed(2)})`;
  return "absent";
}

function signsBlock(segment) {
  if (!segment.signs || !segment.signs.length) {
    const dl = segment.double_line || {};
    return `<p class="metrics">No signs accepted in this segment. `
         + `Double line: ${doubleLineText(dl)}`
         + `</p>`;
  }
  return `<table><tr><th>sign</th><th>confidence</th><th>distance along route</th></tr>`
       + segment.signs.map((sign) =>
           `<tr><td>${sign.cls === "other_sign" ? "Other sign" : sign.cls}</td>`
         + `<td class="metrics">${sign.conf.toFixed(2)}</td>`
         + `<td class="metrics">${Math.round(sign.at_m)} m</td></tr>`).join("")
       + `</table>`;
}

function generatedRecommendations(segment) {
  if (!segment.recommendations || !segment.recommendations.length) {
    return `<p class="metrics">No gap found: every matching mitigation is present.</p>`;
  }
  return segment.recommendations.map((rec) =>
    `<div class="rec"><div class="rule">${RULE_TITLE[rec.rule] ?? rec.rule}</div>`
  + `<div class="text">${recommendationText(rec)}</div></div>`).join("");
}

// A reviewer's text replaces the generated recommendations on this page only;
// report.json keeps gap-check's own, which stay one click away beneath it.
function recommendationsBlock(segment) {
  const edit = segment.review && segment.review.recommendation;
  const generatedPlain = (segment.recommendations || []).map(recommendationText).join("\n\n");
  const shown = edit
    ? `<div class="rec reviewed"><div class="rule">Reviewer's recommendation</div>`
      + `<div class="text">${textEscape(edit.text)}</div>`
      + `<div class="review-status">edited ${new Date(edit.reviewed_at).toLocaleString()}</div></div>`
      + `<details class="rec-generated"><summary>Generated recommendation</summary>`
      + `${generatedRecommendations(segment)}</details>`
    : generatedRecommendations(segment);
  return shown
    + `<details class="rec-edit"><summary>Edit recommendation</summary>`
    + `<textarea id="rec-text">${textEscape(edit ? edit.text : generatedPlain)}</textarea>`
    + `<button id="rec-save" class="primary">Save</button> `
    + (edit ? `<button id="rec-reset">Restore generated</button>` : "")
    + `</details>`;
}

function saveRecommendation(text, button) {
  const segment = data.segments[selected];
  button.disabled = true;
  fetch(`${routePrefix()}review`, {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ segment_id: segment.segment_id, module: "recommendation", text }),
  })
    .then((response) => {
      if (!response.ok) throw new Error(`save failed (${response.status})`);
      return response.json();
    })
    .then((entry) => {
      segment.review = segment.review || {};
      if (entry) segment.review.recommendation = entry;
      else delete segment.review.recommendation;
      renderSegmentList();
      renderDetail();
    })
    .catch((error) => {
      button.disabled = false;
      alert(`Could not save recommendation: ${error.message}`);
    });
}

document.addEventListener("click", (event) => {
  if (event.target.id === "rec-save") {
    saveRecommendation(document.getElementById("rec-text").value, event.target);
  } else if (event.target.id === "rec-reset") {
    saveRecommendation("", event.target);
  }
});

// Display only: the sentences are built from each recommendation's structured
// fields, worded no more strongly than gapcheck.py's rules check. A rule this
// page does not know falls back to gapcheck.py's own text.
const RULE_TITLE = {
  curve_warning_incomplete: "Curve warning incomplete",
  grade_overtaking_control_missing: "No overtaking control on a critical grade",
};
// The warning sign JKR ATJ 2B/85 cl. 2.3 names for the series (gapcheck.py).
const SIGN_NAME = {
  "WD.10a": "a Curve sign (WD.10a, curve to the right)",
  "WD.10b": "a Curve sign (WD.10b, curve to the left)",
  "WD.2a": "a Reverse Curve sign (WD.2a, right curve first)",
  "WD.2b": "a Reverse Curve sign (WD.2b, left curve first)",
  "WD.11": "a Winding Road sign (WD.11)",
};

function recommendationText(rec) {
  const trigger = rec.trigger || {};
  const has = (list, key) => (list || []).includes(key);
  let text;
  if (rec.rule === "curve_warning_incomplete") {
    // One recommendation per series of curves (closer than 180 m apart); every
    // critical segment the series crosses carries the same one.
    const count = Math.round(trigger.curves || 1);
    const what = count > 1 ? `a series of ${count} curves (${trigger.series_id})` : `a curve (${trigger.series_id})`;
    text = `This segment lies on ${what} sharper than the threshold, from `
         + `${Math.round(trigger.curve_start_m)} m to ${Math.round(trigger.curve_end_m)} m `
         + `along the route; the sharpest radius is about ${Math.round(trigger.radius_m)} m. `
         + `JKR ATJ 2B/85 calls for ${SIGN_NAME[trigger.sign_code] ?? trigger.sign_code} `
         + `about ${Math.round(trigger.sign_at_m)} m along the route, 230 m before the first curve. `;
    if (has(rec.missing, "advance_bend_sign")) {
      text += "The detector found no bend warning sign near there. ";
    } else if (has(rec.unchecked, "advance_bend_sign")) {
      text += "Whether one is there could not be checked: the photos do not cover that stretch. ";
    } else {
      text += "A bend warning sign was detected there. ";
    }
    const without = Math.round(trigger.curves_without_chevrons || 0);
    if (!without) text += "Chevron alignment markers were detected on every curve.";
    else if (count === 1) text += "No chevron alignment markers were detected on the curve.";
    else text += `No chevron alignment markers were detected on ${without} of the ${count} curves.`;
  } else if (rec.rule === "grade_overtaking_control_missing") {
    const grade = trigger.grade_pct ? ` (${trigger.grade_pct.toFixed(1)}%)` : "";
    text = `This segment has a critical grade${grade}, and no overtaking control `
         + `was detected: neither a No overtaking sign nor a double centre line.`;
  } else {
    text = rec.text;
  }
  return text;
}

const LANE_COLOR = "#3fb950";
const FAINT_LANE_COLOR = "#f85149";
const SIGN_COLOR = "#d29922";
const SVG_NS = "http://www.w3.org/2000/svg";

function inFrame(x, y, width, height) {
  return x >= 0 && x < width && y >= 0 && y < height;
}

// Off-frame points are dropped rather than clamped. CLRerNet extends curved
// lanes past the image edge, and a clamped point would draw a marking along
// the border that was never detected there.
// Each line is labelled with the contrast delineation grades it by, at its
// nearest point, and drawn red when that falls below weber_adequate.
function drawLanes(svg, record, width, height) {
  const confThreshold = data.config.lane.clrernet_conf;
  const adequate = data.config.lane.weber_adequate;
  const contrasts = data.lane_contrast || {};
  const fontSize = Math.max(14, width / 36);
  for (const instance of record.instances) {
    if (instance.conf < confThreshold) continue;
    const points = instance.points.filter(([x, y]) => inFrame(x, y, width, height));
    if (!points.length) continue;
    const contrast = contrasts[instance.id];
    const color = contrast != null && contrast < adequate ? FAINT_LANE_COLOR : LANE_COLOR;
    if (points.length === 1) {
      const [x, y] = points[0];
      const circle = document.createElementNS(SVG_NS, "circle");
      circle.setAttribute("cx", x);
      circle.setAttribute("cy", y);
      circle.setAttribute("r", 4);
      circle.setAttribute("fill", color);
      svg.appendChild(circle);
    } else {
      const polyline = document.createElementNS(SVG_NS, "polyline");
      polyline.setAttribute("points", points.map(([x, y]) => `${x},${y}`).join(" "));
      polyline.setAttribute("fill", "none");
      polyline.setAttribute("stroke", color);
      polyline.setAttribute("stroke-width", 3);
      polyline.setAttribute("vector-effect", "non-scaling-stroke");
      svg.appendChild(polyline);
    }
    if (contrast == null) continue;
    const [x, y] = points.reduce((low, point) => (point[1] > low[1] ? point : low));
    const label = document.createElementNS(SVG_NS, "text");
    label.setAttribute("x", Math.min(Math.max(x, 1.5 * fontSize), width - 1.5 * fontSize));
    label.setAttribute("text-anchor", "middle");
    label.setAttribute("y", Math.max(y - fontSize / 2, fontSize));
    label.setAttribute("fill", color);
    label.setAttribute("stroke", "#000");
    label.setAttribute("stroke-width", Math.max(2, fontSize / 6));
    label.setAttribute("paint-order", "stroke");
    label.setAttribute("font-size", fontSize);
    label.setAttribute("font-weight", "600");
    label.textContent = contrast.toFixed(2);
    svg.appendChild(label);
  }
}

// The class string is what gap-check matches on, so it is shown with the
// confidence that decided whether it was accepted at all.
function drawSigns(svg, record, width) {
  const confThreshold = data.config.sign.conf;
  const fontSize = Math.max(12, width / 64);
  for (const instance of record.instances) {
    if (instance.conf < confThreshold) continue;
    const [x1, y1, x2, y2] = instance.bbox;
    const x = Math.min(x1, x2);
    const y = Math.min(y1, y2);
    const w = Math.abs(x2 - x1);
    const h = Math.abs(y2 - y1);
    const rect = document.createElementNS(SVG_NS, "rect");
    rect.setAttribute("x", x);
    rect.setAttribute("y", y);
    rect.setAttribute("width", w);
    rect.setAttribute("height", h);
    rect.setAttribute("fill", "none");
    rect.setAttribute("stroke", SIGN_COLOR);
    rect.setAttribute("stroke-width", 3);
    rect.setAttribute("vector-effect", "non-scaling-stroke");
    svg.appendChild(rect);

    const label = document.createElementNS(SVG_NS, "text");
    label.setAttribute("x", x);
    label.setAttribute("y", Math.max(y - 6, 12));
    label.setAttribute("fill", SIGN_COLOR);
    label.setAttribute("font-size", fontSize);
    label.textContent = `${instance.cls || "?"} ${instance.conf.toFixed(2)}`;
    svg.appendChild(label);
  }
}

function drawOverlay(svg, width, height, frameId) {
  svg.setAttribute("viewBox", `0 0 ${width} ${height}`);
  svg.innerHTML = "";
  const lane = laneByFrame.get(frameId);
  if (lane) drawLanes(svg, lane, width, height);
  const sign = signByFrame.get(frameId);
  if (sign) drawSigns(svg, sign, width);
}

// Stepping frames swaps the image in place rather than rebuilding the panel.
// Rebuilding scrolls back to the top, and restoring scrollTop afterwards does
// not work: the new image has not loaded yet, so the panel is momentarily too
// short and the assignment is clamped.
function showFrame() {
  const frames = data.segments[selected].frame_ids || [];
  const image = document.getElementById("frame-img");
  const overlay = document.getElementById("frame-overlay");
  if (!image || !overlay) return;
  const frameId = frames[frameIndex];
  overlay.classList.toggle("hidden", !overlayVisible);
  image.onload = () => drawOverlay(overlay, image.naturalWidth, image.naturalHeight, frameId);
  image.src = routePrefix() + data.frames[frameId];
  image.alt = frameId;
  document.getElementById("frame-caption").innerHTML =
    `<code>${frameId}</code> · frame ${frameIndex + 1} of ${frames.length}` + frameAt(frameIndex);
  document.getElementById("prev").disabled = frameIndex === 0;
  document.getElementById("next").disabled = frameIndex >= frames.length - 1;
  drawFrameDots();
}

// Where along the route the photo was taken, estimated from its timestamp.
function frameAt(index) {
  const segment = data.segments[selected];
  const at = (segment.frame_m || [])[index];
  if (at == null) return "";
  return ` · at ${Math.round(at)} m (${Math.round(at - segment.start_m)} m into segment)`;
}

function step(delta) {
  const frames = data.segments[selected].frame_ids || [];
  const next = frameIndex + delta;
  if (next < 0 || next >= frames.length) return;
  frameIndex = next;
  showFrame();
}

// The Leaflet map lives in one persistent element. renderDetail() places it in
// the left column; it is parked back in <main> before #detail is rewritten so
// the rewrite never destroys it.
function parkMap() {
  document.querySelector("main").appendChild(document.getElementById("map-card"));
}

function renderDetail() {
  const segment = data.segments[selected];
  const frames = segment.frame_ids || [];
  const worst = worstFlag(segment);
  parkMap();
  document.getElementById("detail").innerHTML = `
    <div class="seg-head">
      <h2 class="seg-title">${segment.segment_id}</h2>
      <span class="seg-range">${Math.round(segment.start_m)}-${Math.round(segment.end_m)} m</span>
      ${flagBadge(worst)}
      ${segmentReviewed(segment) ? `<span class="tag">Reviewed</span>` : ""}
      <span class="seg-pos">Segment ${selected + 1} of ${data.segments.length}</span>
    </div>
    <div class="col col-left">
    <section class="card evidence">
    <div class="card-head"><h2>Evidence</h2></div>
    <div class="card-body">
    ${frames.length
      ? `<figure>
           <div class="frame-wrap">
             <img id="frame-img" alt="">
             <svg id="frame-overlay" class="overlay"></svg>
           </div>
           <figcaption>
             <button id="prev">&larr;</button>
             <button id="next">&rarr;</button>
             <span id="frame-caption"></span>
             <span>green = lane, red = lane below the contrast threshold (label: Weber contrast), amber = signs</span>
             <span class="key-hint">&larr; &rarr; frames &middot; &uarr; &darr; segments</span>
             <label><input type="checkbox" id="overlay-toggle"> show markers</label>
           </figcaption>
         </figure>`
      : `<p class="metrics">No frames fall within this segment.</p>`}
    </div>
    </section>
    <div id="map-slot"></div>
    <section class="card signs">
    <div class="card-head"><h2>Signs and markings</h2></div>
    <div class="card-body">${signsBlock(segment)}</div>
    </section>
    </div>
    <div class="col col-right">
    <section class="card coding">
    <div class="card-head"><h2>iRAP coding</h2><span class="sub">Pipeline result, with the reviewer's code where saved</span></div>
    ${moduleRows(segment)}
    </section>
    <section class="card recs">
    <div class="card-head"><h2>Recommendations</h2></div>
    <div class="card-body">${recommendationsBlock(segment)}</div>
    </section>
    </div>
  `;
  document.getElementById("map-slot").replaceWith(document.getElementById("map-card"));
  if (frames.length) {
    document.getElementById("prev").addEventListener("click", () => step(-1));
    document.getElementById("next").addEventListener("click", () => step(1));
    const overlayToggle = document.getElementById("overlay-toggle");
    overlayToggle.checked = overlayVisible;
    overlayToggle.addEventListener("change", () => {
      overlayVisible = overlayToggle.checked;
      localStorage.setItem(OVERLAY_KEY, overlayVisible ? "shown" : "hidden");
      document.getElementById("frame-overlay").classList.toggle("hidden", !overlayVisible);
    });
    showFrame();
  }
}

function select(index) {
  selected = index;
  frameIndex = 0;
  document.querySelectorAll(".seg").forEach((node) => {
    const active = Number(node.dataset.i) === index;
    node.classList.toggle("active", active);
    // The details overview can select a segment far down the list.
    if (active) node.scrollIntoView({ block: "nearest" });
  });
  if (detailsDialog.open && detailCharts.length) renderDetails();
  if (map && layers[index]) map.fitBounds(layers[index].getBounds().pad(1.5));
  highlightSelected();
  renderDetail();
}

// The map card follows the frame card's height and the window width, and
// Leaflet caches its container size, so nudge it whenever the box changes.
new ResizeObserver(() => { if (map) map.invalidateSize(); })
  .observe(document.getElementById("map"));

// Curvature and grade details: the chain from IMU samples to the segment's
// flag, built from the per-sample series export.py writes (build_profile) with
// the same functions the modules use. A modal, so the page behind is inert
// while it is open: the theme and the route cannot change under it.
const detailsDialog = document.getElementById("details");
const CONTEXT_M = 30;  // shown either side of the segment, to see the approach and exit
let detailCharts = [];
let overviewChart = null;
let detailsModule = "curvature";

function detailsButton(module) {
  // A data.json exported before a module's series existed gets no button.
  const ready = { curvature: data.profile?.radius_m, grade: data.profile?.pitch_deg };
  if (!ready[module]) return "";
  return `<button class="details-open" data-module="${module}">Details</button>`;
}

function cssVar(name) {
  return getComputedStyle(document.documentElement).getPropertyValue(name).trim();
}

function segmentAt(dist) {
  return data.segments.findIndex((s) => dist >= s.start_m && dist < s.end_m);
}

// Curvature in 1/km. Plotted instead of radius: a straight road's radius runs
// to infinity and off any axis, while its curvature is simply near zero.
function kappa(radius) {
  return radius == null ? null : 1000 / radius;
}

// Tick positions on the iRAP radius bands. The threshold is always labelled;
// the others only where they would not overlap a label already placed.
function radiusSplits(kMax, threshold) {
  const kept = [0, threshold];
  for (const k of [1.25, 2.5, 5, 10, 20, 50]) {
    if (k <= kMax && kept.every((other) => Math.abs(other - k) >= kMax / 8)) kept.push(k);
  }
  return kept.sort((a, b) => a - b);
}

function radiusLabel(k) {
  return k === 0 ? "straight" : `R ${Math.round(1000 / k)} m`;
}

// The sample that set the flag: the smallest radius among windows lying wholly
// inside the segment, as analyse_curvature takes it (first occurrence on a
// tie, as numpy's argmin).
function decidingSample() {
  const segment = data.segments[selected];
  const { dist_m: dist, radius_m: radius } = data.profile;
  const half = data.config.curvature.window_m / 2;
  let best = -1;
  for (let i = 0; i < dist.length; i++) {
    if (dist[i] - half < segment.start_m || dist[i] + half > segment.end_m || radius[i] == null) continue;
    if (best < 0 || radius[i] < radius[best]) best = i;
  }
  return best;
}

// The GPS cross-check under a flag: what it read and whether it agrees. The
// IMU decided the flag either way (curvature.py, grade.py).
function crossCheckHtml(reading, disagrees) {
  if (reading == null) return "";
  return `<p class="calc">${reading}: `
    + (disagrees
      ? `<b class="critical">disagrees</b> on the flag, so this segment needs review.`
      : `agrees on the flag.`)
    + ` The dashed line is the GPS reading.</p>`;
}

function summaryHtml(entry, i) {
  const t = data.config.curvature;
  if (entry.flag === "not_assessed" || i < 0) {
    return `<p><b>Not assessed.</b> ${entry.notes ?? ""}</p>`;
  }
  const p = data.profile;
  const bias = entry.gyro_bias_rad_s ?? 0;
  const turnDeg = t.window_m / entry.radius_m * 180 / Math.PI;
  const verdict = entry.flag === "critical"
    ? `<b class="critical">Critical:</b> the tightest radius, ${Math.round(entry.radius_m)} m, is below the ${t.threshold_m} m threshold.`
    : `<b class="normal">Normal:</b> the tightest radius, ${Math.round(entry.radius_m)} m, is at or above the ${t.threshold_m} m threshold.`;
  return `<p>${verdict}</p>`
    + `<p class="calc">At ${Math.round(p.dist_m[i])} m (t = ${p.time_s[i].toFixed(1)} s): `
    + `radius = road length ÷ heading change over the ${t.window_m} m of road centred here, `
    + `the sharpest ${t.window_m} m lying wholly inside this segment `
    + `= ${t.window_m} m ÷ ${turnDeg.toFixed(1)}° = ${Math.round(entry.radius_m)} m.<br>`
    + `Heading is the gyro z reading integrated over time. A window of road, not a single `
    + `sample, because gyro noise and steering corrections are not road geometry. `
    // estimate_gyro_bias returns exactly 0 when the route has no stationary window.
    + (bias === 0
      ? `The gyro is uncorrected: the route has no stationary window to estimate its bias from. `
      : `The gyro bias, ${bias.toFixed(4)} rad/s, estimated once for the route from stationary `
        + `samples, is removed first. `)
    + `Samples below ${t.v_min_mps} m/s (${Math.round(t.v_min_mps * 3.6)} km/h) are left out: `
    + `radius is undefined as speed approaches zero.</p>`
    + crossCheckHtml(entry.gps_radius_m == null ? null
      : `GPS bearing, through the same ${t.window_m} m windows, reads the sharpest as `
        + (entry.gps_radius_m >= 1e5 ? "straight" : `${Math.round(entry.gps_radius_m)} m`),
      entry.needs_review);
}

// Draws behind the series: the segment shaded, its boundaries, and any
// horizontal reference lines; on top, a vertical line at the deciding sample.
function shadeHooks(lines, deciding, band = null) {
  const dpr = uPlot.pxRatio;
  return {
    drawAxes: [(u) => {
      const { left, top, width, height } = u.bbox;
      const segment = data.segments[selected];
      const ctx = u.ctx;
      ctx.save();
      ctx.beginPath(); ctx.rect(left, top, width, height); ctx.clip();
      const x0 = u.valToPos(segment.start_m, "x", true);
      const x1 = u.valToPos(segment.end_m, "x", true);
      ctx.fillStyle = cssVar("--active-bg");
      ctx.fillRect(x0, top, x1 - x0, height);
      if (band) {
        const b0 = u.valToPos(band[0], "x", true), b1 = u.valToPos(band[1], "x", true);
        ctx.globalAlpha = 0.18;
        ctx.fillStyle = cssVar("--critical");
        ctx.fillRect(b0, top, Math.max(b1 - b0, dpr), height);
        ctx.globalAlpha = 1;
      }
      ctx.lineWidth = dpr;
      ctx.setLineDash([5 * dpr, 4 * dpr]);
      for (const line of lines) {
        const y = u.valToPos(line.value, "y", true);
        ctx.strokeStyle = line.color;
        ctx.beginPath(); ctx.moveTo(left, y); ctx.lineTo(left + width, y); ctx.stroke();
      }
      ctx.restore();
    }],
    draw: [(u) => {
      if (deciding == null) return;
      const { top, height } = u.bbox;
      const x = u.valToPos(deciding, "x", true);
      const ctx = u.ctx;
      ctx.save();
      ctx.strokeStyle = cssVar("--critical");
      ctx.lineWidth = dpr;
      ctx.beginPath(); ctx.moveTo(x, top); ctx.lineTo(x, top + height); ctx.stroke();
      ctx.restore();
    }],
  };
}

function baseAxis(extra) {
  const grid = cssVar("--line");
  return {
    stroke: cssVar("--muted"), grid: { stroke: grid, width: 1 },
    ticks: { stroke: grid, width: 1 }, size: 70, ...extra,
  };
}

// One detail chart: a window of the route, its own y range fitted to it.
function detailChart(el, series, axis, lines, deciding, cols, range = null, band = null) {
  const xAxis = baseAxis({ size: 40, values: (u, ticks) => ticks.map((v) => `${v} m`) });
  return new uPlot({
    width: el.clientWidth, height: 150,
    cursor: { sync: { key: "details" }, drag: { x: false, y: false } },
    legend: { show: true },
    scales: { x: { time: false }, ...(range ? { y: { range } } : {}) },
    axes: [xAxis, baseAxis(axis)],
    // uPlot draws sample dots only when the samples are sparse, i.e. when the
    // car is fast; that read as a normal/critical difference, so never draw them.
    series: [{ label: "Distance", value: (u, v) => (v == null ? "-" : `${v.toFixed(1)} m`) },
             ...series.map((s) => ({ ...s, points: { show: false } }))],
    hooks: shadeHooks(lines, deciding, band),
  }, cols, el);
}

// The overview's shading plus a strip along the top, one block per segment in
// the open module's flag colour, so the route's critical stretches read at a glance.
function overviewHooks() {
  const hooks = shadeHooks([], null);
  hooks.drawAxes.push((u) => {
    const { top } = u.bbox;
    const dpr = uPlot.pxRatio;
    const colour = { critical: "--critical", normal: "--normal" };
    const ctx = u.ctx;
    ctx.save();
    for (const segment of data.segments) {
      const x0 = u.valToPos(segment.start_m, "x", true);
      const x1 = u.valToPos(segment.end_m, "x", true);
      ctx.fillStyle = cssVar(colour[segment[detailsModule]?.flag] || "--unassessed");
      ctx.fillRect(x0, top, Math.max(x1 - x0 - dpr, dpr), 6 * dpr);
    }
    ctx.restore();
  });
  return hooks;
}

function renderOverview() {
  const el = document.getElementById("details-overview");
  overviewChart?.destroy();
  const p = data.profile;
  overviewChart = new uPlot({
    width: el.clientWidth, height: 80,
    cursor: { drag: { x: false, y: false }, points: { show: false } },
    legend: { show: false },
    // Headroom above the highest peak keeps the line clear of the flag strip.
    scales: { x: { time: false }, y: { range: (u, min, max) => {
      const floor = Math.min(0, min);
      return [floor, max + (max - floor) * 0.35];
    } } },
    axes: [baseAxis({ size: 24, values: (u, ticks) => ticks.map((v) => `${v} m`) }),
           baseAxis({ show: false, size: 70 })],
    series: [{}, { stroke: cssVar("--muted"), width: 1, points: { show: false } }],
    hooks: overviewHooks(),
  }, [p.dist_m, detailsModule === "grade" ? p.grade_pct : p.radius_m.map(kappa)], el);
  // The overview is the route-level navigation: a click opens that segment.
  overviewChart.over.addEventListener("click", () => {
    const i = segmentAt(overviewChart.posToVal(overviewChart.cursor.left, "x"));
    if (i >= 0) select(i);
  });
}

function renderDetails() {
  const segment = data.segments[selected];
  const name = detailsModule === "grade" ? "Grade" : "Curvature";
  document.getElementById("details-title").textContent =
    `${name} details · ${segment.segment_id} (${Math.round(segment.start_m)}-${Math.round(segment.end_m)} m)`;
  document.getElementById("details-prev").disabled = selected === 0;
  document.getElementById("details-next").disabled = selected === data.segments.length - 1;
  overviewChart.redraw(false);

  // The window: the segment plus context either side.
  const p = data.profile;
  const lo = segment.start_m - CONTEXT_M, hi = segment.end_m + CONTEXT_M;
  const idx = [];
  p.dist_m.forEach((d, k) => { if (d >= lo && d <= hi) idx.push(k); });
  const pick = (values, f = (v) => v) => idx.map((k) => (values[k] == null ? null : f(values[k])));
  detailCharts.forEach((chart) => chart.destroy());
  (detailsModule === "grade" ? renderGradeDetails : renderCurvatureDetails)(segment, pick, pick(p.dist_m));
}

function renderCurvatureDetails(segment, pick, dist) {
  const entry = segment.curvature || {};
  const p = data.profile;
  const t = data.config.curvature;
  const i = decidingSample();
  const bias = entry.gyro_bias_rad_s ?? 0;
  document.getElementById("details-summary").innerHTML = summaryHtml(entry, i);

  const deg = (v) => v * 180 / Math.PI;
  const deciding = i >= 0 ? p.dist_m[i] : null;
  const faint = cssVar("--border2"), critical = cssVar("--critical"), text = cssVar("--text");

  const kMax = Math.max(5.5, ...pick(p.radius_m, kappa).filter((v) => v != null)) * 1.1;
  // Older reports carry no cross-check series; a route without GPS bearing, all nulls.
  const gpsCurve = (p.gps_radius_m ?? []).some((v) => v != null);
  detailCharts = [
    detailChart(document.getElementById("chart-a"), [
      { label: "Yaw rate, raw", stroke: faint, width: 1, value: (u, v) => (v == null ? "-" : `${v.toFixed(2)}°/s`) },
      { label: "Yaw rate, bias removed", stroke: text, width: 1.5, value: (u, v) => (v == null ? "-" : `${v.toFixed(2)}°/s`) },
    ], { values: (u, ticks) => ticks.map((v) => `${v}°/s`) }, [{ value: 0, color: faint }], deciding,
    [dist, pick(p.yaw_rate_rad_s, deg), pick(p.yaw_rate_rad_s, (v) => deg(v - bias))]),

    detailChart(document.getElementById("chart-b"), [
      { label: "Speed", stroke: text, width: 1.5, value: (u, v) => (v == null ? "-" : `${v.toFixed(1)} km/h`) },
    ], { values: (u, ticks) => ticks.map((v) => `${v} km/h`) },
    [{ value: t.v_min_mps * 3.6, color: critical }], deciding,
    [dist, pick(p.speed_mps, (v) => v * 3.6)]),

    detailChart(document.getElementById("chart-c"), [
      { label: "Curvature", stroke: text, width: 1.5,
        value: (u, v, s, k) => (k == null ? "-" : v == null ? "below min speed"
          : `${v.toFixed(2)} /km (R ${Math.round(1000 / v)} m)`) },
      ...(gpsCurve ? [{ label: "GPS bearing", stroke: cssVar("--accent"), width: 1.25, dash: [5, 4],
        value: (u, v) => (v == null ? "-" : `${v.toFixed(2)} /km (R ${Math.round(1000 / v)} m)`) }] : []),
    ], {
      // Ticks sit on the iRAP radius bands, labelled as radius.
      splits: () => radiusSplits(kMax, 1000 / t.threshold_m),
      values: (u, ticks) => ticks.map(radiusLabel),
    }, [
      { value: 1000 / 800, color: faint },
      { value: 1000 / t.threshold_m, color: critical },
      { value: 1000 / 200, color: faint },
    ], deciding,
    [dist, pick(p.radius_m, kappa), ...(gpsCurve ? [pick(p.gps_radius_m, kappa)] : [])], () => [0, kMax]),
  ];

  // Samples within the segment itself, the ones the flag was taken over.
  const rows = [];
  for (let k = 0; k < p.dist_m.length; k++) {
    if (p.dist_m[k] < segment.start_m || p.dist_m[k] >= segment.end_m) continue;
    const used = p.radius_m[k] != null;
    rows.push(`<tr class="${k === i ? "deciding" : ""}${used ? "" : " gated"}">`
      + `<td>${p.dist_m[k].toFixed(1)}</td><td>${p.time_s[k].toFixed(2)}</td>`
      + `<td>${deg(p.yaw_rate_rad_s[k]).toFixed(2)}</td><td>${deg(p.yaw_rate_rad_s[k] - bias).toFixed(2)}</td>`
      + `<td>${(p.speed_mps[k] * 3.6).toFixed(1)}</td>`
      + `<td>${used ? (p.radius_m[k] >= 1e5 ? "straight" : Math.round(p.radius_m[k])) : "-"}</td>`
      + (gpsCurve ? `<td>${p.gps_radius_m[k] == null ? "-" : p.gps_radius_m[k] >= 1e5 ? "straight" : Math.round(p.gps_radius_m[k])}</td>` : "")
      + `<td>${used ? "yes" : "no, below min speed"}</td></tr>`);
  }
  document.getElementById("details-samples").innerHTML =
    `<summary>Samples in this segment (${rows.length})</summary>`
    + `<table><tr><th>Distance (m)</th><th>Time (s)</th><th>Yaw raw (°/s)</th>`
    + `<th>Yaw, bias removed (°/s)</th><th>Speed (km/h)</th><th>Radius (m)</th>`
    + (gpsCurve ? `<th>GPS bearing radius (m)</th>` : "") + `<th>Used</th></tr>`
    + rows.join("") + `</table>`;
}

// Grade details: pitch from the accelerometer (with the vehicle's own
// acceleration removed) averaged over window_m of road, then the steepest grade
// held for a tenth of the segment. The window and the deciding sample come from
// export.py (grade_windows), which runs analyse_grade's own search.
function gradeSummaryHtml(segment, entry) {
  const t = data.config.grade, w = segment.grade_window;
  if (entry.flag === "not_assessed" || !w) {
    return `<p><b>Not assessed.</b> ${entry.notes ?? ""}</p>`;
  }
  const p = data.profile, i = w.index, g = entry.grade_pct;
  const minLength = data.config.segment.length_m / 10;
  const verdict = entry.flag === "critical"
    ? `<b class="critical">Critical:</b> the steepest grade held for ${minLength} m, ${g.toFixed(1)}%, is at or beyond the ±${t.threshold_pct}% threshold.`
    : `<b class="normal">Normal:</b> the steepest grade held for ${minLength} m, ${g.toFixed(1)}%, is within the ±${t.threshold_pct}% threshold.`;
  return `<p>${verdict}</p>`
