# Every threshold in the pipeline. Each value carries its source in a comment.
# Provisional values are marked; they are subject to sensitivity analysis.

segment:
  length_m: 100                  # iRAP coding unit (Star Rating manual)
  # Aggregation is per-module, never global.
  # Road Condition counts defects across the whole segment before classifying;
  # implementing it as max-over-frames makes count always 1 and silently
  # prevents the iRAP 5-vs-1-4 boundary from ever firing.
  aggregation:
    lane: max_risk
    curvature: max_risk
    grade: max_risk
    condition: count_then_classify

sampling:
  target_spacing_m: 20           # PLACEHOLDER: derive from per-frame detectable
                                 # ground footprint (FOV, mount height, range)
                                 # once camera parameters are known

curvature:
  threshold_m: 400               # iRAP Curvature Risk Factor boundary (provisional)
  v_min_mps: 5.0                 # below this, curvature is not_assessed
  stationary_speed_mps: 0.5      # vehicle stopped; distinct from v_min_mps, which
                                 # is the floor for curvature being assessable at all
  stationary_accel_var: 0.05     # variance ceiling that counts as stationary

grade:
  threshold_pct: 7.5             # iRAP Grade Risk Factor boundary (provisional)
  comp_filter_alpha: 0.98        # complementary filter: gyro weight

lane:
  clrernet_conf: 0.41            # CLRerNet official default
  weber_watch: 0.35              # provisional contrast band boundary
  weber_urgent: 0.20             # provisional contrast band boundary
  bg_window: 81                  # background window for contrast sampling

doubleline:                      # from the doubleline_coord_scan experiment
  window_steps: [50, 90, 130, 180, 240]
  bg_window: 81
  contrast_thresh: 0.4
  min_width: 3
  min_gap_merge: 2
  min_gap_px: 3
  max_gap_fraction: 0.9
  max_gap_cap_px: 150
  anchor_tol_px: 20

sign:
  conf: 0.0                      # accept YOLO default; low-conf cases escalate later

condition:
  yolo_conf: 0.35
  width_threshold_cm: 20         # iRAP size boundary
  count_poor: 5                  # >= this many qualifying defects -> critical
  count_medium: 1                # 1..4 qualifying defects -> watch
  ipm:
    camera_height_m: null        # REQUIRED from data provider; null disables width
    fx: null
    fy: null
    cx: null
    cy: null
    max_range_m: 15.0            # width estimated only within this near-field band

gapcheck:
  curve_sign_distance_m: 230     # JKR: bend sign placed 230 m before curve entry
  curve_sign_tolerance_m: 50     # tolerance around that point
